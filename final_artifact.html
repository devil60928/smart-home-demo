// 遙控開著時輕量更新(只改文字/數值,不重建 DOM,不打斷觸控)
function updateRemote(id) {
  const el = document.getElementById('remoteSheet');
  if (!el || !_rcDev) return;
  const tv = _rcDev === 'tv';
  if (tv && ![TV, SOUNDBAR].includes(id)) return;
  if (!tv && ![PROJ.brightness, PROJ.volume].includes(id)) return;
  let isOn;
  if (tv) { const e = store.get(TV); isOn = e && !['off', 'unavailable', 'unknown'].includes(e.state); }
  else { const b = store.get(PROJ.brightness); isOn = b && !['unavailable', 'unknown'].includes(b.state); }

  if (sub) sub.textContent = (isOn ? '開機中' : '已關機') + (tv ? '' : ' · Google TV');
  el.querySelector('#rcPower')?.classList.toggle('on', !!isOn);
  const sl = el.querySelector('#rcVol');

  g.addEventListener('pointercancel', end);
}
// 2) 點外圍收合:點到平面圖空白/黑色背景就關(點到房間仍是換房,不受影響)。
//    做法:stage 上的「輕觸」(位移 <8px、<600ms,排除旋轉/拖曳)延遲 120ms 判定——
//    若 raycast 沒命中任何房間(roomClick/openDevice 沒發),就收合
let _roomHitAt = 0;
bus.on('roomClick', () => _roomHitAt = Date.now());
bus.on('openDevice', () => _roomHitAt = Date.now());
bus.on('toggleLight', () => _roomHitAt = Date.now());
{
  const stage = $('#stage');
  let sx = 0, sy = 0, st = 0;
  stage.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = Date.now(); });
  stage.addEventListener('pointerup', e => {
    if (!currentRoom) return;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8 || Date.now() - st > 600) return;   // 拖曳/旋轉不算
    const t = Date.now();
    setTimeout(() => { if (_roomHitAt < t && currentRoom) backToOverview(); }, 120);
  });
}
function backToOverview() {
  insp.classList.add('hidden');
  scene.resetFocus();
  currentRoom = null;
  overviewBtn.classList.add('hidden');
}

function roomStateSummary(room) {   // Room Intelligence
  const devs = dm.byRoom(room.id);
  const lights = devs.filter(d => d.cfg.type === 'light');
  const lightsOn = lights.filter(d => d.state === 'on').length;
  return { devs, lights: { total: lights.length, on: lightsOn } };
}

function renderInspector() {
  if (!currentRoom || insp.classList.contains('hidden')) return;
  // 空間中樞:HA 連線且該區域有註冊裝置 → 顯示全裝置清單;否則退回原本的燈光面板
  if (hubReady() && renderHub(inspBody, currentRoom)) return;
  renderInspectorLegacy();
}
function renderInspectorLegacy() {
  const r = currentRoom;
  const { devs, lights } = roomStateSummary(r);
  let html = `
    <div class="insp-type">空間</div>
    <div class="insp-name">${r.name}</div>
    <div class="insp-en">${r.en.toUpperCase()}</div>
    <div class="insp-status">${lights.on} / ${lights.total} 盞燈開啟</div>`;
  devs.forEach(d => { html += `<div data-dev="${d.cfg.key}">${d.inspectorHTML()}</div>`; });
  inspBody.innerHTML = html;
  devs.forEach(d => d.bindInspector(inspBody.querySelector(`[data-dev="${d.cfg.key}"]`)));
}
// 精準更新:只有目前房間的 entity 變動才重繪 Inspector
bus.on('entity', ({ id }) => {
  if (!currentRoom) return;
  const dev = dm.byEntity(id);

  if ((dev?.cfg.room === currentRoom.id || inHub) && !document.activeElement?.matches('input[type=range]'))
    renderInspector();
});

bus.on('conn', ({ state }) => { if (state === 'connected' && !hubReady()) loadRoomHub(ha); });

initExtraPanels(ha);

// 關閉所有面板,回到首頁狀態
function closePanels() {

moreBtn.onclick = () => {

};
$('#more').querySelectorAll('[data-go]').forEach(b => {
  b.onclick = () => {
    document.querySelector(`.nav-btn[data-panel="${b.dataset.go}"]`)?.click();
    moreBtn.classList.add('active');   // 手機上來源分頁隱藏,活性標記留在「更多」
  };
});

// 手機 Bottom Sheet:面板頂端拉桿,下滑或點一下即關閉
document.querySelectorAll('.dock-panel').forEach(p => {
  const g = document.createElement('div');
  g.className = 'sheet-grip';
  g.setAttribute('aria-label', '關閉面板');
  p.prepend(g);
  let sy = 0, dy = 0, drag = false, wasDrag = false;
  g.addEventListener('pointerdown', e => { drag = true; dy = 0; wasDrag = false; sy = e.clientY; g.setPointerCapture(e.pointerId); p.style.transition = 'none'; });
  g.addEventListener('pointermove', e => { if (!drag) return; dy = Math.max(0, e.clientY - sy); if (dy > 8) wasDrag = true; p.style.transform = `translateY(${dy}px)`; });
  g.addEventListener('pointerup', () => {
    drag = false; p.style.transition = ''; p.style.transform = '';
    if (dy > 64) closePanels(); dy = 0;                // 拖超過 64px 才關
  });
  g.addEventListener('click', () => { if (!wasDrag) closePanels(); wasDrag = false; });   // 純點一下才關;小幅下拉放開=回彈,不誤關
});
document.querySelectorAll('.nav-btn[data-panel],.nav-btn[data-view]').forEach(btn => {   // 只綁面板/視角鈕,不覆蓋自訂鈕(如快速開關)
  btn.onclick = () => {
    if (btn.dataset.view) { scene.cycleView(); return; }
    document.querySelectorAll('.nav-btn[data-panel]').forEach(b => b.classList.toggle('active', b === btn));
    Object.entries(panels).forEach(([k, el]) => el?.classList.toggle('hidden', k !== btn.dataset.panel));
    // 手機:切到任何面板前先收起房間 bottom sheet,避免兩層 sheet 疊在一起(z-index 30 蓋 25)
    if (btn.dataset.panel !== 'home' && currentRoom && matchMedia('(max-width:760px)').matches) backToOverview();
    if (btn.dataset.panel === 'ai') renderInsights();
    if (btn.dataset.panel === 'security') renderSecurity();
    if (btn.dataset.panel === 'history') loadHistory();
    if (btn.dataset.panel === 'climate') renderClimate();
    if (btn.dataset.panel === 'clean') renderClean();
    if (btn.dataset.panel === 'appl') renderAppliance();
  };
});

// ══════════ HA 連線設定(網址/權杖由使用者在頁面輸入,只存於本機 localStorage)══════════
$('#haUrl').value = TokenProvider.getUrl();
if (TokenProvider.getToken()) $('#haToken').placeholder = '已設定(留空表示沿用)';
$('#haSave').onclick = () => {

// ══════════ Scenes(真正 scene.turn_on 或本地轉場)══════════
const grid = $('#sceneGrid');
SCENES.forEach(sc => {

// ══════════ Security ══════════
function renderSecurity() {
  const s = securityState();
  const phone = store.get('device_tracker.leo')?.state;   // Leo 的手機(路由器 Wi-Fi 存在偵測)
  const motionRow = `<div class="quiet-row"><span>人體感應</span><b>${s.motion ? '偵測到活動' : '無活動'}</b></div>
    ${phone ? `<div class="quiet-row"><span>在家狀態</span><b>${phone === 'home' ? '在家(手機已連 Wi-Fi)' : '外出'}</b></div>` : ''}`;
  // v69 常開門(廁所/主臥/廚房拉門)不列入監控,頁尾註記避免「怎麼只剩 2 顆門」的疑惑
  const normNames = Object.values(DOOR_INFO).filter(d => d.normallyOpen).map(d => d.name);
  const normHint = normNames.length ? `<div class="conn-hint">常開門不列入監控:${normNames.join('、')}</div>` : '';
  if (s.secure) {                               // Quiet by default
    $('#secBody').innerHTML = `
      <div class="sec-headline ok">● 全屋安全</div>
      <div class="sec-detail quiet-row"><span>所有監控門窗皆已關妥。</span></div>
      ${motionRow}${normHint}`;
    return;
  }
  $('#secBody').innerHTML = `
    <div class="sec-headline alert">需要注意</div>
    <div class="sec-detail">
    ${[...s.doors.open, ...s.windows.open].map(e => {
      const secs = Math.floor((Date.now() - new Date(e.last_changed)) / 1000);
      // 門名從 DOOR_INFO 唯一名單取(來源:config/devices.js);查不到退 friendly_name,最後才是 entity_id
      const name = DOOR_INFO[e.entity_id]?.name ?? e.attributes?.friendly_name ?? e.entity_id;
      return `<div class="sec-alerts">${name}開啟中 · ${secs} 秒前</div>`;
    }).join('')}
    </div>
    <div class="hr"></div>
    <div class="quiet-row"><span>門</span><b>${s.doors.closed} / ${s.doors.total} 已關</b></div>
    ${motionRow}${normHint}`;
}
bus.on('entity', ({ attributes }) => {
  if (!panels.security.classList.contains('hidden') &&
      ['door', 'window', 'motion', 'occupancy'].includes(attributes?.device_class)) renderSecurity();
});

// ══════════ History · Time Machine ══════════
let histHours = 6;
const RANGES = [['1H', 1], ['6H', 6], ['24H', 24], ['7D', 168]];
RANGES.forEach(([label, h]) => {
  const b = document.createElement('button');
  b.className = 'hist-btn' + (h === histHours ? ' active' : ''); b.textContent = label;
  b.onclick = () => { histHours = h; $('#histRanges').querySelectorAll('.hist-btn').forEach(x => x.classList.toggle('active', x === b)); loadHistory(); };
  $('#histRanges').appendChild(b);
});
// v68 空間切換:紀錄頁可直接點任何有溫度感測的空間,不再只能跟著平面圖選取走
let histRoomId = null;
function buildHistRooms(activeId) {
  const box = $('#histRooms'); if (!box) return;
  box.innerHTML = '';
  ROOMS.forEach(r => {
    if (isNaN(store.num(`sensor.${r.id}_temperature`, NaN))) return;   // 只列目前有溫度資料的空間
    const b = document.createElement('button');
    b.className = 'hist-btn' + (r.id === activeId ? ' active' : '');
    b.textContent = r.name;
    b.onclick = () => { histRoomId = r.id; loadHistory(); };
    box.appendChild(b);
  });
}
bus.on('roomClick', () => { histRoomId = null; });   // 平面圖選了房間,紀錄頁跟著它
async function loadHistory() {
  const roomId = histRoomId ?? currentRoom?.id ?? 'living';
  buildHistRooms(roomId);
  $('#histRoom').textContent = (ROOMS.find(r => r.id === roomId) ?? ROOMS[1]).name;
  const data = await getHistory(ha, `sensor.${roomId}_temperature`, histHours);
  const cv = $('#histChart'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!data?.length) {                                    // 查無真實歷史:明講,不畫假曲線
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('此空間目前沒有溫度紀錄', cv.width / 2, cv.height / 2);
    return;
  }
  const vs = data.map(p => p.v), min = Math.min(...vs) - .3, max = Math.max(...vs) + .3;
  ctx.beginPath();
  data.forEach((p, i) => {
    const x = i / (data.length - 1) * cv.width;
    const y = cv.height - (p.v - min) / (max - min) * (cv.height - 14) - 7;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.strokeStyle = 'rgba(155,163,174,.85)'; ctx.lineWidth = 1.2; ctx.stroke();
  // v70 修:textAlign 曾被「無資料」訊息設成 center 且殘留,標籤從 x=4 置中導致被切掉;單位補上 °C
  ctx.fillStyle = 'rgba(98,107,118,.9)'; ctx.font = '10px Inter'; ctx.textAlign = 'left';
  ctx.fillText(`${max.toFixed(1)}°C`, 4, 12); ctx.fillText(`${min.toFixed(1)}°C`, 4, cv.height - 4);
}

// ══════════ Energy(無全屋電表:統計「有電力監測」的裝置——智慧插座×5 + 日立冷氣 + 冰箱)══════════
const PWR_W = [                                                   // 即時功率(W)
  'sensor.cuco_sg_690794855_wp5m_electric_power_p_3_2',           // 廚餘機插座
  'sensor.cuco_sg_631782625_wp5m_electric_power_p_3_2',           // 電風扇插座
  'sensor.cuco_sg_690776803_wp5m_electric_power_p_3_2',           // Switch 2 插座
  'sensor.cuco_sg_695327718_wp12_electric_power_p_11_4',          // Gosund 延長線(整條)
];
const PWR_W_SCALED = { 'sensor.chuangmi_cn_433572485_212a01_electric_power_p_5_6': 0.01 };  // Dyson 充電座(原廠單位 0.01W)
const KWH_AC = ['sensor.ke_ting_power_consumption', 'sensor.zhu_wo_power_consumption', 'sensor.xiao_fang_jian_power_consumption', 'sensor.ke_wo_power_consumption'];
const KWH_FRIDGE = 'sensor.bing_xiang_1_ben_yue_hao_dian_liang';  // 冰箱本月耗電
const KWH_PLUGS = [
  'sensor.cuco_sg_690794855_wp5m_power_consumption_p_3_1', 'sensor.cuco_sg_631782625_wp5m_power_consumption_p_3_1',
  'sensor.cuco_sg_690776803_wp5m_power_consumption_p_3_1', 'sensor.cuco_sg_695327718_wp12_power_consumption_p_11_1',
  'sensor.chuangmi_cn_433572485_212a01_power_consumption_p_5_1',
];
const sparkData = [];
setInterval(() => {
  const sum = ids => ids.reduce((a, id) => a + store.num(id, 0), 0);
  const w = sum(PWR_W) + Object.entries(PWR_W_SCALED).reduce((a, [id, k]) => a + store.num(id, 0) * k, 0);
  $('#enNow').innerHTML = `${Math.round(w)}<small> W</small>`;
  tweenNumber($('#enToday'), sum(KWH_AC), ' kWh', 1);
  tweenNumber($('#enSolar'), store.num(KWH_FRIDGE, 0), ' kWh', 1);
  tweenNumber($('#enGrid'), sum(KWH_PLUGS), ' kWh', 1);
  sparkData.push(w); if (sparkData.length > 60) sparkData.shift();
  drawSpark();
}, 2000);
function drawSpark() {
  const cv = $('#enSpark'), ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (sparkData.length < 2) return;
  const max = Math.max(...sparkData) * 1.2 || 1;
  ctx.beginPath();
  sparkData.forEach((v, i) => {
    const x = i / (sparkData.length - 1) * cv.width, y = cv.height - v / max * cv.height;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.strokeStyle = 'rgba(155,163,174,.8)'; ctx.lineWidth = 1.2; ctx.stroke();
}

// ══════════ AI Insight(Rule Engine + 可操作)══════════
function renderInsights() {
  const list = insight.evaluate();
  const h = new Date().getHours();
  const greet = h < 6 ? '夜深了。' : h < 11 ? '早安。' : h < 18 ? '午安。' : '晚安。';
  $('#aiText').innerHTML = `<div class="ai-greet">${greet}</div>` + list.map((it, i) => `
    <div class="ai-insight ${it.level}">
      <div>${it.text}</div>
      ${it.actions.map(a => `<button class="ai-act ${a.label === 'VIEW' ? 'ghost' : ''}" data-i="${i}" data-a="${a.label}">${a.label === 'TURN OFF' ? '關閉' : '查看'}</button>`).join('')}
    </div>`).join('');
  $('#aiText').querySelectorAll('.ai-act').forEach(btn => {
    btn.onclick = () => {
      const act = list[+btn.dataset.i].actions.find(a => a.label === btn.dataset.a);
      if (act.room) { const room = ROOMS.find(r => r.id === act.room); scene.focusRoom(room); openRoom(room); }
      if (act.lights) act.lights.forEach(id => dm.get(`${id}Light`)?.turn(false));
      setTimeout(renderInsights, 600);
    };
  });
}
$('#aiOptimize').onclick = async () => {
  for (const id of ['entry', 'hall', 'bath1', 'bath2', 'balc']) {
    dm.get(`${id}Light`)?.turn(false);
    await new Promise(r => setTimeout(r, 160));
  }
  setTimeout(renderInsights, 700);
};
