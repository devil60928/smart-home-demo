<title>LEO RESIDENCE · SMART HOME OS(示範版)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════ AMBIENT SMART HOME OS · Design System v3 ═══════════ */
:root{
  /* color tokens */
  --bg:#0B0D0F; --surface:#111418; --elevated:#171B20;
  --text:#F5F7FA; --text-2:#9BA3AE; --muted:#626B76;
  --accent:#6FB7FF;          /* electric blue,僅互動/選取 */
  --warm:#FFD9A0;            /* 燈光 */
  --ok:#8BD9A0; --warn:#F5C065; --danger:#F08A8A;
  --hairline:rgba(255,255,255,.07);
  /* spacing */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:40px; --s7:64px;
  /* radius */
  --r1:8px; --r2:12px; --r3:18px;
  /* motion */
  --m-micro:120ms; --m-fast:180ms; --m-normal:280ms; --m-slow:450ms;
  --ease:cubic-bezier(.32,.72,.24,1);
  /* type */
  --f-ui:'Inter','Noto Sans TC',system-ui,sans-serif;
  --f-display:'Space Grotesk','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 700px at 50% 42%, #151a20 0%, var(--bg) 58%),
    radial-gradient(2000px 1400px at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%);
  color:var(--text); font-family:var(--f-ui);
  overflow:hidden; user-select:none; -webkit-user-select:none;
  font-feature-settings:'tnum';
}
.hidden{opacity:0 !important; pointer-events:none !important}

/* ═══ Boot ═══ */
#boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:var(--bg);transition:opacity .9s var(--ease)}
.boot-inner{text-align:center;width:min(360px,78vw)}
.boot-title{font-family:var(--f-display);font-size:1.15rem;font-weight:500;letter-spacing:.32em;text-indent:.32em;color:var(--text)}
.boot-sub{font-size:.72rem;letter-spacing:.12em;color:var(--muted);margin:14px 0 30px}
.boot-bar{height:2px;background:rgba(255,255,255,.06);border-radius:1px;overflow:hidden}
.boot-fill{height:100%;width:0%;background:var(--text-2);transition:width .5s var(--ease)}
.boot-log{margin-top:16px;font-size:.68rem;letter-spacing:.1em;color:var(--muted)}

/* ═══ HUD:安靜、留白 ═══ */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(22px + env(safe-area-inset-top)) 30px 0;
  transition:opacity var(--m-slow) var(--ease)}
.hud-left{display:flex;flex-direction:column;gap:2px}
.hud-brand{font-family:var(--f-display);font-size:.78rem;font-weight:500;letter-spacing:.26em;color:var(--text-2)}
#greeting{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.hud-dot{display:none;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}
.hud-dot.off,.hud-dot.sync{display:inline-block}
.hud-dot.off{background:var(--danger)} .hud-dot.sync{background:var(--accent);animation:pulse 1.2s infinite}
.hud-conn{font-size:.66rem;color:var(--muted);letter-spacing:.08em}
.hud-right{text-align:right}
#hudTemp{font-family:var(--f-display);font-size:1.9rem;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1}
#hudTemp .deg{font-size:1rem;vertical-align:.55em;color:var(--text-2);margin-left:1px}
#hudClock{font-size:.72rem;color:var(--muted);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.hud-sep{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

#stage{position:fixed;inset:0;z-index:1}
#stage canvas{display:block}

/* ═══ Ambient Device Marker(平常極簡,互動才展開)═══ */
.dev-label{pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:none;padding:6px;transition:opacity var(--m-normal) var(--ease)}
.dev-label i{width:14px;height:14px;border-radius:50%;background:#f2f4f6;border:2px solid rgba(11,13,15,.28);
  transition:all var(--m-normal) var(--ease);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.dev-label.on i{background:var(--warm);border-color:rgba(255,217,160,.65);box-shadow:0 0 12px 3px rgba(255,217,160,.5)}
.dev-label b{font-weight:400;font-size:.64rem;letter-spacing:.1em;color:var(--text-2);
  opacity:0;transform:translateY(-3px);transition:all var(--m-normal) var(--ease);white-space:nowrap;
  padding:3px 8px;border-radius:6px;background:rgba(11,13,15,.55);backdrop-filter:blur(8px)}
.dev-label.reveal b,.dev-label:hover b{opacity:1;transform:translateY(0)}
.dev-label:hover i{transform:scale(1.5)}

/* Room tooltip:hover 的第二層資訊 */
.room-tip{pointer-events:none;font-family:var(--f-ui);
  background:rgba(17,20,24,.78);backdrop-filter:blur(14px);
  border:1px solid var(--hairline);border-radius:var(--r2);
  padding:14px 18px;min-width:150px;transform:translateY(-10px)}
.room-tip h4{font-family:var(--f-display);font-size:.7rem;letter-spacing:.22em;font-weight:500;color:var(--text-2);margin-bottom:8px}
.room-tip .big{font-family:var(--f-display);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums}
.room-tip .row{display:flex;justify-content:space-between;gap:16px;font-size:.7rem;line-height:2;color:var(--muted)}
.room-tip .row b{color:var(--text-2);font-weight:400}
.room-tip .on{color:var(--warm)}

/* ═══ Inspector:大字、留白、單一主行動 ═══ */
#inspector{position:fixed;top:96px;right:28px;z-index:30;width:264px;box-shadow:0 18px 60px rgba(0,0,0,.45);
  max-height:calc(100vh - 190px);overflow-y:auto;
  background:rgba(17,20,24,.8);backdrop-filter:blur(18px);
  border:1px solid var(--hairline);border-radius:var(--r3);
  padding:26px 24px;transition:opacity var(--m-normal) var(--ease)}
#inspClose{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:1.15rem;cursor:pointer}
#inspClose:hover{color:var(--text)}
.insp-type{font-size:.6rem;letter-spacing:.3em;color:var(--muted)}
.insp-name{font-family:var(--f-display);font-size:1.3rem;font-weight:500;margin:6px 0 2px}
.insp-en{font-size:.62rem;letter-spacing:.24em;color:var(--muted)}
.insp-status{font-size:.66rem;letter-spacing:.1em;color:var(--text-2);margin:14px 0 6px}
.insp-metric{margin:18px 0}
.insp-metric label{font-size:.6rem;letter-spacing:.24em;color:var(--muted)}
.insp-metric .val{font-family:var(--f-display);font-size:2.3rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.insp-metric .val small{font-size:1rem;color:var(--muted);font-weight:400}
input[type=range].insp-slider,input[type=range].ac-slider{width:100%;margin:10px 0 2px;accent-color:var(--text);height:2px}
.insp-actions{display:flex;gap:8px;margin-top:18px}
.insp-btn{flex:1;font-family:var(--f-ui);letter-spacing:.14em;font-size:.7rem;padding:11px 0;
  background:transparent;color:var(--text-2);border:1px solid var(--hairline);border-radius:var(--r1);
  cursor:pointer;transition:all var(--m-fast) var(--ease)}
.insp-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.insp-btn.primary{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:500}

/* ═══ Dock Panels:安靜、資料為主角 ═══ */
.dock-panel{position:fixed;left:30px;bottom:88px;z-index:25;width:min(340px,calc(100vw - 60px));box-shadow:0 18px 60px rgba(0,0,0,.45);
  background:rgba(17,20,24,.8);backdrop-filter:blur(18px);
  border:1px solid var(--hairline);border-radius:var(--r3);
  padding:24px 26px;transition:opacity var(--m-normal) var(--ease)}
.dock-title{font-family:var(--f-display);font-size:.66rem;letter-spacing:.3em;color:var(--muted);margin-bottom:16px}
.hr{height:1px;background:var(--hairline);margin:16px 0}
.big-number{font-family:var(--f-display);font-size:2.6rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.big-number small{font-size:1.1rem;color:var(--muted);font-weight:400}
.quiet-row{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);line-height:2.1}
.quiet-row b{color:var(--text-2);font-weight:400;font-variant-numeric:tabular-nums}

.scene-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.scene-btn{font-family:var(--f-ui);font-size:.76rem;letter-spacing:.08em;text-align:left;
  padding:12px 10px;background:transparent;color:var(--muted);border:none;border-radius:var(--r1);
  cursor:pointer;transition:all var(--m-fast) var(--ease)}
.scene-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.scene-btn.active{color:var(--text)}
.scene-btn.active::before{content:'● ';color:var(--warm);font-size:.5rem;vertical-align:2px}

#enSpark{width:100%;height:44px;opacity:.75}
.hist-ranges{display:flex;gap:2px;margin-bottom:12px}
.hist-btn{font-size:.64rem;letter-spacing:.12em;padding:5px 12px;background:transparent;
  color:var(--muted);border:none;border-radius:var(--r1);cursor:pointer}
.hist-btn.active{color:var(--text);background:rgba(255,255,255,.06)}
#histChart{width:100%;height:104px}

.sec-headline{font-family:var(--f-display);font-size:.92rem;letter-spacing:.14em;font-weight:500}
.sec-headline.ok{color:var(--text-2)} .sec-headline.alert{color:var(--warn)}
.sec-detail{margin-top:14px}
.sec-alerts{font-size:.76rem;color:var(--warn);line-height:2}

.ai-greet{font-family:var(--f-display);font-size:1.15rem;font-weight:500;margin-bottom:4px}
.ai-insight{padding:12px 0;border-bottom:1px solid var(--hairline);font-size:.8rem;line-height:1.75;color:var(--text-2)}
.ai-insight:last-child{border-bottom:none}
.ai-insight.warning{color:var(--warn)}
.ai-insight .big{font-family:var(--f-display);font-size:1.5rem;color:var(--text);font-variant-numeric:tabular-nums}
.ai-act{margin-top:8px;font-size:.66rem;letter-spacing:.16em;padding:7px 16px;
  background:var(--text);color:var(--bg);border:none;border-radius:999px;cursor:pointer;font-weight:500}
.ai-act.ghost{background:transparent;color:var(--text-2);border:1px solid var(--hairline)}
.ai-btn{margin-top:14px;width:100%;font-size:.7rem;letter-spacing:.2em;padding:11px 0;
  background:transparent;color:var(--text-2);border:1px solid var(--hairline);border-radius:var(--r1);cursor:pointer}
.ai-btn:hover{color:var(--text)}

/* ═══ Navigation:文字、極淡、選取才有存在感 ═══ */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:30px;
  padding:16px 12px calc(18px + env(safe-area-inset-bottom));transition:opacity var(--m-slow) var(--ease)}
.nav-btn{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.24em;padding:6px 2px;
  background:transparent;color:var(--muted);border:none;cursor:pointer;
  transition:color var(--m-fast) var(--ease);position:relative}
.nav-btn:hover{color:var(--text-2)}
.nav-btn.active{color:var(--text)}
.nav-btn.active::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-7px;
  width:3px;height:3px;border-radius:50%;background:var(--text)}

#toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:60;
  font-size:.72rem;letter-spacing:.1em;padding:9px 22px;border-radius:999px;
  background:rgba(17,20,24,.85);border:1px solid var(--hairline);color:var(--text-2);
  backdrop-filter:blur(12px);transition:opacity var(--m-slow)}
#toast.ok{color:var(--ok)}

/* ═══ Ambient Mode:牆面顯示器 ═══ */
body.idle #nav,body.idle .dock-panel,body.idle #inspector{opacity:.5}
body.ambient #nav,body.ambient .dock-panel,body.ambient #inspector,body.ambient .dev-label b{opacity:0;pointer-events:none}
body.ambient #hud{opacity:.85}
body.ambient #stage{filter:brightness(.92)}
#stage,body #hud{transition:opacity .8s var(--ease),filter 1.2s var(--ease)}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition-duration:1ms !important}
}

/* ═══ Mobile:Bottom Sheet ═══ */
@media (max-width:760px){
  #hud{padding:calc(16px + env(safe-area-inset-top)) 20px 0}
  #hudTemp{font-size:1.3rem}
  #inspector{top:auto;right:0;left:0;bottom:0;width:100%;max-height:58vh;
    border-radius:var(--r3) var(--r3) 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  #inspector::before{content:'';display:block;width:36px;height:4px;border-radius:2px;
    background:rgba(255,255,255,.15);margin:-8px auto 16px}
  .dock-panel{left:12px;bottom:70px;width:calc(100vw - 24px)}
  #nav{gap:16px}
  .nav-btn{font-size:.64rem;letter-spacing:.16em}
}

/* ── 回到全景(上帝視角)按鈕 ── */
#overviewBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:40;
  font-family:var(--f-ui);font-size:.7rem;letter-spacing:.18em;color:var(--text-2);cursor:pointer;
  background:rgba(17,20,24,.8);backdrop-filter:blur(14px);
  border:1px solid var(--hairline);border-radius:999px;padding:11px 24px;
  transition:all var(--m-normal) var(--ease)}
#overviewBtn:hover{color:var(--text);border-color:rgba(255,255,255,.22)}
body.ambient #overviewBtn{opacity:0;pointer-events:none}

/* ── 快速開關模式按鈕 ── */
#quickBtn.quick-on{color:var(--warm)}
#quickBtn.quick-on::before{content:'● ';font-size:.7em;vertical-align:.15em}

/* ── HA 連線設定面板 ── */
.conn-field{margin:14px 0}
.conn-field label{display:block;font-size:.6rem;letter-spacing:.24em;color:var(--muted);margin-bottom:6px}
.conn-field input{width:100%;box-sizing:border-box;font-family:var(--f-ui);font-size:.78rem;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--hairline);border-radius:var(--r1);
  padding:10px 12px;outline:none;transition:border-color var(--m-fast) var(--ease)}
.conn-field input:focus{border-color:rgba(255,255,255,.25)}
.conn-actions{display:flex;gap:10px;margin:16px 0 12px}
.conn-hint{font-size:.64rem;line-height:1.8;color:var(--muted);letter-spacing:.04em}

/* ── 冷氣遙控面板 ── */
.ac-top{display:flex;justify-content:space-between;align-items:flex-start;margin-top:4px}
.ac-cur{font-size:.66rem;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
.ac-mode-now{font-size:.7rem;letter-spacing:.1em;color:var(--text-2);margin-top:4px}
.ac-power{width:52px;height:52px;border-radius:50%;font-size:1.25rem;cursor:pointer;
  background:transparent;color:var(--muted);border:1px solid var(--hairline);
  transition:all var(--m-fast) var(--ease)}
.ac-power.on{color:var(--warm);border-color:rgba(255,217,160,.5);box-shadow:0 0 14px rgba(255,217,160,.25)}
.ac-power:hover{color:var(--text)}
.ac-steps{display:flex;gap:10px;margin:16px 0 4px}
.ac-step{flex:1;height:48px;border-radius:var(--r2);font-size:1.3rem;cursor:pointer;
  background:rgba(255,255,255,.05);color:var(--text-2);border:1px solid var(--hairline);
  transition:all var(--m-fast) var(--ease)}
.ac-step:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.ac-sec{font-size:.6rem;letter-spacing:.26em;color:var(--muted);margin:14px 0 8px}
.ac-chips{display:flex;flex-wrap:wrap;gap:6px}
.ac-chip{font-family:var(--f-ui);font-size:.68rem;letter-spacing:.1em;padding:8px 13px;cursor:pointer;
  background:transparent;color:var(--muted);border:1px solid var(--hairline);border-radius:999px;
  transition:all var(--m-fast) var(--ease)}
.ac-chip:hover{color:var(--text)}
.ac-chip.active{color:var(--bg);background:var(--text);border-color:var(--text);font-weight:500}
.ac-dim{opacity:.35;pointer-events:none}
#climate,#clean,#appl,#scenes,#security,#ai,#energy,#history,#conn{max-height:calc(100vh - 170px);overflow-y:auto}   /* 寬螢幕:所有 dock 面板超高就內捲,不再長出畫面外 */

/* ── 掃拖面板 ── */
.cl-name{font-family:var(--f-display);font-size:.86rem;letter-spacing:.12em;font-weight:500;margin-bottom:8px}

/* ── 行動裝置:觸控與版面 ── */
#stage{touch-action:none}
@media (max-width:640px){
  #nav{gap:14px;overflow-x:auto;justify-content:flex-start;padding-left:14px;padding-right:14px;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  #inspector{left:12px;right:12px;width:auto;top:auto;bottom:86px;max-height:50vh}
  .dock-panel{left:12px;right:12px;width:auto;bottom:80px}
  #overviewBtn{bottom:126px}
  #hud{padding-left:16px;padding-right:16px}
}

/* ═══════════ v12 UX 重整:觸控目標 / 手勢 / 響應式 ═══════════ */
/* 按壓回饋:所有可點元素都有明確的物理反應 */
.nav-btn:active,.ac-chip:active,.insp-btn:active,.ac-step:active,
.scene-btn:active,.hist-btn:active,.ai-act:active,.ai-btn:active,
.more-grid button:active,#mapCtl button:active,#overviewBtn:active{transform:scale(.94)}
.ac-power:active{transform:scale(.92)}

/* 導覽列:44px 觸控目標 */
.nav-btn{min-height:44px;padding:8px 4px}
.nav-more{display:none}

/* 更多抽屜 */
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.more-grid button{font-family:var(--f-ui);font-size:.8rem;letter-spacing:.16em;padding:18px 0;
  background:rgba(255,255,255,.04);border:1px solid var(--hairline);border-radius:var(--r2);
  color:var(--text-2);cursor:pointer;transition:all var(--m-fast) var(--ease)}
.more-grid button:hover{color:var(--text);border-color:rgba(255,255,255,.2)}

/* 地圖懸浮控制(視角/快速):右側中段,拇指可及 */
#mapCtl{position:fixed;right:14px;top:44%;z-index:35;display:flex;flex-direction:column;gap:10px;
  transition:opacity var(--m-slow) var(--ease)}
#mapCtl button{width:48px;height:48px;border-radius:50%;cursor:pointer;
  background:rgba(17,20,24,.72);backdrop-filter:blur(12px);
  border:1px solid var(--hairline);color:var(--text-2);
  font-family:var(--f-ui);font-size:.6rem;letter-spacing:.1em;
  transition:all var(--m-fast) var(--ease)}
#mapCtl button:hover{color:var(--text);border-color:rgba(255,255,255,.22)}
#mapCtl #quickBtn.quick-on{color:var(--warm);border-color:rgba(255,217,160,.5);
  box-shadow:0 0 12px rgba(255,217,160,.22)}
body.ambient #mapCtl{opacity:0;pointer-events:none}

/* Bottom sheet 拉桿(僅手機顯示) */
.sheet-grip{display:none}

/* ── 手機(≤760px):主要 5 頁 + 更多;面板 = bottom sheet ── */
@media (max-width:760px){
  .nav-sec{display:none}
  .nav-more{display:block}
  #nav{gap:0;justify-content:space-around;overflow:visible;padding-left:6px;padding-right:6px}
  .nav-btn{flex:1;font-size:.7rem;letter-spacing:.1em}
  .sheet-grip{display:block;width:56px;height:24px;margin:-12px auto 6px;cursor:grab;touch-action:none}
  .sheet-grip::after{content:'';display:block;width:38px;height:4px;border-radius:2px;
    background:rgba(255,255,255,.18);margin:10px auto}
  .dock-panel{left:10px;right:10px;width:auto;
    bottom:calc(76px + env(safe-area-inset-bottom));max-height:60vh;overflow-y:auto;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
  .dock-panel:not(.hidden){animation:sheetUp .3s var(--ease)}
  #inspector{bottom:calc(76px + env(safe-area-inset-bottom))}
  #overviewBtn{bottom:calc(146px + env(safe-area-inset-bottom))}
  #mapCtl{right:10px;top:auto;bottom:calc(150px + env(safe-area-inset-bottom))}
  #mapCtl button{width:46px;height:46px}
}
@keyframes sheetUp{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── 平板(761–1100px):面板加寬,導覽完整顯示 ── */
@media (min-width:761px) and (max-width:1100px){
  .dock-panel{width:min(400px,44vw)}
  #nav{gap:22px}
}

/* ── v13 家電頁 ── */

<script type="module">
// ===== small shared demo assets =====
// Minimal inline placeholder image (dark tile + camera glyph) used wherever the demo
// can't show a real camera feed — keeps petcamCard()/openPetCam() visually honest.
const PET_PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360">
     <rect width="640" height="360" fill="#14181d"/>
     <text x="320" y="176" font-family="Inter,sans-serif" font-size="20" fill="#626b76" text-anchor="middle">示範模式 · 模擬畫面</text>
     <text x="320" y="204" font-family="Inter,sans-serif" font-size="13" fill="#454c54" text-anchor="middle">DEMO MODE · NO LIVE FEED</text>
   </svg>`
);
// ===== EventBus =====

// ═══ EventBus:模組間解耦通訊 ═══
class EventBus {
  constructor(){ this.map = new Map(); }
  on(type, fn){ (this.map.get(type) ?? this.map.set(type, []).get(type)).push(fn); }
  emit(type, payload){ (this.map.get(type) || []).forEach(fn => fn(payload)); }
}
const bus = new EventBus();


// ===== StateStore =====

// ═══ StateStore · Phase 2:完整 Entity 物件 + 精準訂閱 ═══
class StateStore {
  constructor(){ this.entities = new Map(); this.subs = new Map(); }
  setEntity(id, state, attributes = {}, last_changed = null, last_updated = null) {
    const prev = this.entities.get(id);
    const ent = {
      entity_id: id, state, attributes,
      last_changed: last_changed ?? (prev && prev.state === state ? prev.last_changed : new Date().toISOString()),
      last_updated: last_updated ?? new Date().toISOString()
    };
    this.entities.set(id, ent);
    const changed = !prev || prev.state !== state ||
      JSON.stringify(prev.attributes) !== JSON.stringify(attributes);
    if (changed) {
      bus.emit('entity', { id, ...ent, prev });
      (this.subs.get(id) || []).forEach(fn => fn(ent, prev));   // 精準訂閱:只通知關心此 entity 的物件
    }
  }
  subscribe(id, fn){ (this.subs.get(id) ?? this.subs.set(id, []).get(id)).push(fn); }
  get(id){ return this.entities.get(id); }
  getEntity(id){ return this.entities.get(id); }
  isOn(id){ return this.get(id)?.state === 'on'; }
  num(id, d = 0){ const v = parseFloat(this.get(id)?.state); return isNaN(v) ? d : v; }
  byDomain(domain){ return [...this.entities.values()].filter(e => e.entity_id.startsWith(domain + '.')); }
  byDeviceClass(cls){ return [...this.entities.values()].filter(e => e.attributes?.device_class === cls); }
}
const store = new StateStore();


// ===== HA_PRESET (demo build: intentionally blank) =====

const HA_PRESET = { url: '', token: '' };

// ===== CommandManager =====

// ═══ CommandManager:debounce / queue / optimistic / retry ═══
// UI 不直接碰 WebSocket;所有服務呼叫經由此層

class CommandManager {
  constructor(ha){ this.ha = ha; this.debouncers = new Map(); }

  // Optimistic:先改本地狀態 → 呼叫服務 → 失敗還原
  async optimistic(entityId, nextState, nextAttrs, serviceCall) {
    const prev = store.get(entityId);
    store.setEntity(entityId, nextState, { ...prev?.attributes, ...nextAttrs });
    try { await serviceCall(); }
    catch (e) {
      if (prev) store.setEntity(entityId, prev.state, prev.attributes);   // RESTORE
      bus.emit('toast', { msg: 'UNABLE TO CONTROL DEVICE', ok: false });
      throw e;
    }
  }

  // Debounce:滑桿高頻輸入合併(預設 220ms)
  debounce(key, fn, wait = 220) {
    clearTimeout(this.debouncers.get(key));
    this.debouncers.set(key, setTimeout(fn, wait));
  }
}


// ===== BaseDevice / device types =====

// ═══ Device Type System:BaseDevice 抽象 ═══

class BaseDevice {
  constructor(cfg, cmd) {
    this.cfg = cfg;                 // { key, entityId, type, room, position, label }
    this.cmd = cmd;
    this.listeners = [];
    store.subscribe(cfg.entityId, (ent, prev) => this.onState(ent, prev));
  }
  get entity() { return store.get(this.cfg.entityId); }
  get state()  { return this.entity?.state; }
  get label()  { return this.cfg.label || this.entity?.attributes?.friendly_name || this.cfg.entityId; }
  onState() {}                      // 子類覆寫:狀態 → 視覺
  inspectorHTML() { return `<div class="insp-metric"><label>STATE</label><div class="val">${this.state ?? '--'}</div></div>`; }
  bindInspector() {}                // 子類覆寫:綁定 Inspector 事件
  icon() { return '●'; }
}

class LightDevice extends BaseDevice {
  get on(){ return this.state === 'on'; }
  get brightness(){ return this.entity?.attributes?.brightness ?? 0; }
  toggle() {
    return this.cmd.optimistic(this.cfg.entityId, this.on ? 'off' : 'on', {},
      () => this.cmd.ha.callService('light', 'toggle', { entity_id: this.cfg.entityId }));
  }
  turn(on) {
    return this.cmd.optimistic(this.cfg.entityId, on ? 'on' : 'off', {},
      () => this.cmd.ha.callService('light', on ? 'turn_on' : 'turn_off', { entity_id: this.cfg.entityId }));
  }
  setBrightness(v) {
    this.cmd.optimistic(this.cfg.entityId, 'on', { brightness: v }, () => Promise.resolve());
    this.cmd.debounce(this.cfg.entityId + ':br', () =>
      this.cmd.ha.callService('light', 'turn_on', { entity_id: this.cfg.entityId, brightness: v })
        .catch(() => {}));
  }
  icon(){ return '💡'; }
  inspectorHTML() {
    const pct = Math.round(this.brightness / 255 * 100);
    return `
      <div class="insp-metric"><label>電源</label><div class="val">${this.on ? '開啟' : '關閉'}</div></div>
      <div class="insp-metric">
        <label>亮度 · <span data-br-pct>${pct}</span>%</label>
        <input type="range" class="insp-slider" data-br min="1" max="255" value="${this.brightness || 128}" ${this.on ? '' : 'disabled'}>
      </div>
      <div class="insp-actions">
        <button class="insp-btn ${this.on ? '' : 'primary'}" data-off>關燈</button>
        <button class="insp-btn ${this.on ? 'primary' : ''}" data-on>開燈</button>
      </div>`;
  }
  bindInspector(root) {
    root.querySelector('[data-on]')?.addEventListener('click', () => this.turn(true));
    root.querySelector('[data-off]')?.addEventListener('click', () => this.turn(false));
    root.querySelector('[data-br]')?.addEventListener('input', e => {
      root.querySelector('[data-br-pct]').textContent = Math.round(e.target.value / 255 * 100);
      this.setBrightness(+e.target.value);
    });
  }
}

class SensorDevice extends BaseDevice {
  get unit(){ return this.entity?.attributes?.unit_of_measurement ?? ''; }
  get deviceClass(){ return this.entity?.attributes?.device_class ?? 'sensor'; }
  icon(){ return { temperature:'🌡', humidity:'💧', power:'⚡', energy:'⚡', co2:'☁', illuminance:'☀' }[this.deviceClass] ?? '◈'; }
  inspectorHTML() {
    const NAMES = { temperature: '溫度', humidity: '濕度', power: '功率', energy: '用電',
                    illuminance: '照度', co2: '二氧化碳', pm25: 'PM2.5', battery: '電量' };
    return `<div class="insp-metric"><label>${NAMES[this.deviceClass] ?? '感測'}</label>
      <div class="val">${this.state ?? '--'}<small> ${this.unit}</small></div></div>`;
  }
}

class BinarySensorDevice extends BaseDevice {
  get open(){ return this.state === 'on'; }
  get deviceClass(){ return this.entity?.attributes?.device_class ?? 'opening'; }
  icon(){ return this.deviceClass === 'motion' ? '👁' : '🚪'; }
  inspectorHTML() {
    const cls = this.deviceClass;
    const CN = { motion: '動態感測', door: '門', window: '窗', opening: '開闔' };
    const label = this.open
      ? (cls === 'motion' ? '● 偵測到動態' : '⚠ 開啟中')
      : (cls === 'motion' ? '○ 無動態' : '● 已關閉');
    return `<div class="insp-metric"><label>${CN[cls] ?? cls}</label>
      <div class="val" style="font-size:1.1rem;color:${this.open ? 'var(--warning)' : 'var(--success)'}">${label}</div></div>`;
  }
}

class ClimateDevice extends BaseDevice {
  inspectorHTML() {
    const a = this.entity?.attributes ?? {};
    return `
      <div class="insp-metric"><label>目前溫度</label><div class="val">${a.current_temperature ?? '--'}<small> °C</small></div></div>
      <div class="insp-metric"><label>目標溫度</label><div class="val">${a.temperature ?? '--'}<small> °C</small></div></div>
      <div class="insp-metric"><label>模式</label><div class="val" style="font-size:1rem">${({cool:'冷氣',heat:'暖氣',off:'關閉',auto:'自動'})[this.state] ?? this.state} · 風速${({auto:'自動',low:'低',high:'高'})[a.fan_mode] ?? a.fan_mode}</div></div>`;
  }
  icon(){ return '❄'; }
}


// ===== DeviceManager =====

// ═══ DeviceManager:依 config 建立 Device 實例(新增設備只改 devices.js)═══

const TYPES = { light: LightDevice, sensor: SensorDevice, binary_sensor: BinarySensorDevice, climate: ClimateDevice };

class DeviceManager {
  constructor(cmd) {
    this.devices = new Map();
    Object.entries(DEVICES).forEach(([key, cfg]) => {
      const Cls = TYPES[cfg.type] ?? BaseDevice;
      this.devices.set(key, new Cls({ key, ...cfg }, cmd));
    });
  }
  get(key){ return this.devices.get(key); }
  byEntity(entityId){ return [...this.devices.values()].find(d => d.cfg.entityId === entityId); }
  byRoom(roomId){ return [...this.devices.values()].filter(d => d.cfg.room === roomId); }
  all(){ return [...this.devices.values()]; }
}

      if (DOOR_INFO[e.entity_id]?.normallyOpen) return;
      if (e.state === 'on') {
        const mins = Math.floor((now - new Date(e.last_changed)) / 60000);
        const info = DOOR_INFO[e.entity_id];
        const name = info?.name ?? e.attributes?.friendly_name ?? e.entity_id;
        out.push({
          text: `${name}已開啟${mins >= 1 ? ` ${mins} 分鐘` : ''}。`,
          level: 'warning', actions: info?.room ? [{ label: 'VIEW', room: info.room }] : []
        });
      }
    });

    // 規則(v69):平日 08–18 外出中,耗電家電(冷氣/電視/投影機)還開著 → 提醒
    {
      const d = new Date(), wd = d.getDay(), hr = d.getHours();
      const away = store.get('device_tracker.leo')?.state === 'not_home';
      if (wd >= 1 && wd <= 5 && hr >= 8 && hr < 18 && away) {
        const AC_NAME = { 'climate.ke_ting': '客廳冷氣', 'climate.zhu_wo': '主臥冷氣', 'climate.xiao_fang_jian': '小房間冷氣', 'climate.ke_wo': '客臥冷氣' };
        const ons = AC_IDS.filter(id => !['off', 'unavailable', 'unknown', undefined].includes(store.get(id)?.state)).map(id => AC_NAME[id]);
        if (store.get('remote.dian_shi')?.state === 'on') ons.push('電視');
        if (store.isOn('switch.tou_ying_ji')) ons.push('投影機');
        if (ons.length) out.push({ text: `外出中(平日日間),${ons.join('、')}仍開著。`, level: 'warning', actions: [] });
      }
    }

    // 規則:溫度 > 28 且全部冷氣關閉
    const hot = ROOMS.filter(r => store.num(`sensor.${r.id}_temperature`) > 28);
    if (hot.length && AC_IDS.every(id => (store.get(id)?.state ?? 'off') === 'off')) {
      out.push({ text: `${hot.map(r => r.name).join('、')}室溫偏高,空調目前關閉。`, level: 'warning', actions: [] });
    }

    // 規則:公共區無人但燈開著(用真實人體感應器;沒有任何感應器上線時不觸發,避免誤報)
    const occSensors = [...store.byDeviceClass('motion'), ...store.byDeviceClass('occupancy')]
      .filter(e => !['unavailable', 'unknown'].includes(e.state));
    const motionIdle = occSensors.length > 0 && occSensors.every(e => e.state !== 'on');
    const idleOn = ['hall', 'entry', 'bath1', 'bath2'].filter(id => store.isOn(`light.${id}`));
    if (motionIdle && idleOn.length) {
      out.push({
        text: `${idleOn.map(id => ROOMS.find(r => r.id === id)?.name).join('、')}的燈可能忘了關。`,
        level: 'info',
        actions: [{ label: 'TURN OFF', lights: idleOn }]
      });
    }

    // 一般狀態摘要
    const on = ROOMS.filter(r => store.isOn(`light.${r.id}`));
    const temps = ROOMS.map(r => store.num(`sensor.${r.id}_temperature`, NaN)).filter(v => !isNaN(v));
    const avg = temps.length ? (temps.reduce((a, b) => a + b) / temps.length).toFixed(1) : '--';
    const hour = new Date().getHours();
    const greet = hour < 6 ? '夜深了' : hour < 11 ? '早安' : hour < 18 ? '午安' : '晚安';
    out.push({
      text: `${greet},全屋平均 ${avg}°C,${on.length} 個空間開燈,即時功耗 ${store.get('sensor.power_now')?.state ?? '--'} kW。`,
      level: 'ok', actions: []
    });
    return out;
  }
}

// ═══ Security 彙總 ═══
function securityState() {
  // 常開門(normallyOpen)不列入監控與「全屋安全」判定
  const doors = store.byDeviceClass('door').filter(e => !DOOR_INFO[e.entity_id]?.normallyOpen);
  const windows = store.byDeviceClass('window');
  const locks = store.byDomain('lock');
  const motion = [...store.byDeviceClass('motion'), ...store.byDeviceClass('occupancy')].some(e => e.state === 'on');   // Aqara 人體感應器實測回報 occupancy
  const openDoors = doors.filter(e => e.state === 'on');
  const openWins = windows.filter(e => e.state === 'on');
  return {
    secure: !openDoors.length && !openWins.length && locks.every(l => l.state === 'locked'),
    doors: { total: doors.length, closed: doors.length - openDoors.length, open: openDoors },
    windows: { total: windows.length, closed: windows.length - openWins.length, open: openWins },
    locks: { total: locks.length, locked: locks.filter(l => l.state === 'locked').length },
    motion
  };
}

// ═══ History(Time Machine):真機用 HA REST,Demo 生成擬真序列 ═══
async function getHistory(ha, entityId, hours) {
  const real = await ha.fetchHistory([entityId], hours);
  if (real?.[0]?.length) {
    return real[0].map(p => ({ t: new Date(p.last_changed ?? p.lu * 1000), v: parseFloat(p.state) }))
      .filter(p => !isNaN(p.v));
  }
  if (!ha.demo) return [];                 // 真機查無歷史就回空,交由畫面顯示「無資料」,不畫假曲線
  // Demo 模式:以現值往回生成漂移序列
  const cur = store.num(entityId, 25);
  const n = 60, out = [];
  let v = cur;
  for (let i = 0; i < n; i++) {
    out.unshift({ t: new Date(Date.now() - i * hours * 3600e3 / n), v: +v.toFixed(2) });
    v += (Math.random() - .5) * (hours > 6 ? .5 : .2);
  }
  return out;
}

// ═══ 動畫工具 ═══
const lerp = (a, b, t) => a + (b - a) * Math.min(1, t);
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
// 數字平滑過渡(24.8 → 25.0)
function tweenNumber(el, to, unit = '', decimals = 1, dur = 500) {
  const from = parseFloat(el.dataset.v ?? to) || 0;
  const t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    const v = lerp(from, to, easeOutCubic(k));
    el.textContent = v.toFixed(decimals) + unit;
    if (k < 1) requestAnimationFrame(step); else el.dataset.v = to;
  };
  requestAnimationFrame(step);
}

// ═══ AmbientModeManager:ACTIVE → IDLE → AMBIENT(牆面顯示模式)═══
class AmbientModeManager {
  constructor({ idleAfter = 12000, ambientAfter = 30000 } = {}) {
    this.state = 'ACTIVE';
    this.idleAfter = idleAfter;
    this.ambientAfter = ambientAfter;
    this._t = null;
    ['pointerdown', 'pointermove', 'keydown', 'touchstart', 'wheel']
      .forEach(ev => addEventListener(ev, () => this.wake(), { passive: true }));
    this.wake();
  }
  wake() {
    if (this.state !== 'ACTIVE') {
      this.state = 'ACTIVE';
      document.body.classList.remove('idle', 'ambient');
    }
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      this.state = 'IDLE'; document.body.classList.add('idle');
      this._t = setTimeout(() => {
        this.state = 'AMBIENT';
        document.body.classList.remove('idle');
        document.body.classList.add('ambient');
      }, this.ambientAfter - this.idleAfter);
    }, this.idleAfter);
  }
}
// ===== core/HomeAssistantClient.js (demo build: extended offline demo mode) =====
const presetToken = () => (HA_PRESET?.token && HA_PRESET.token !== 'PASTE_TOKEN_HERE') ? HA_PRESET.token : '';
const TokenProvider = {
  getUrl()   { return localStorage.getItem('HA_URL')   || (presetToken() ? (HA_PRESET.url || '') : ''); },
  getToken() { return localStorage.getItem('HA_TOKEN') || presetToken(); },
  set(url, token) { localStorage.setItem('HA_URL', url); localStorage.setItem('HA_TOKEN', token); }
};

class HomeAssistantClient {
  constructor() {
    this.ws = null;
    this.msgId = 1;
    this.status = 'idle';
    this.demo = false;
    this.pending = new Map();
    this.backoff = 1000;
    this._pingTimer = null;
    this._closedByUser = false;
  }

  _setStatus(s) { this.status = s; bus.emit('conn', { state: s }); }

  async connect() {
    const url = TokenProvider.getUrl(), token = TokenProvider.getToken();
    if (!url || !token) { this._startDemo(); return; }
    this._setStatus(this.status === 'idle' ? 'connecting' : 'reconnecting');
    try { this.ws = new WebSocket(url.replace(/^http/, 'ws') + '/api/websocket'); }
    catch { this._scheduleReconnect(); return; }

    this.ws.onmessage = (e) => this._onMessage(JSON.parse(e.data), token);
    this.ws.onclose = () => {
      this._stopPing();
      this.pending.forEach(p => p.reject(new Error('disconnected')));
      this.pending.clear();
      if (this._closedByUser) { this._setStatus('offline'); return; }
      this._setStatus('reconnecting');
      this._scheduleReconnect();
    };
    this.ws.onerror = () => { try { this.ws.close(); } catch {} };
  }

  _scheduleReconnect() {
    setTimeout(() => this.connect(), this.backoff);
    this.backoff = Math.min(this.backoff * 2, 30000);
  }

  async _onMessage(m, token) {
    switch (m.type) {
      case 'auth_required':
        this.ws.send(JSON.stringify({ type: 'auth', access_token: token }));
        break;
      case 'auth_invalid':
        this._closedByUser = true;
        this._setStatus('offline');
        bus.emit('toast', { msg: 'AUTH FAILED — 檢查 HA_TOKEN', ok: false });
        break;
      case 'auth_ok': {
        this.backoff = 1000;
        this._setStatus('syncing');
        try {
          const states = await this.request({ type: 'get_states' });
          states.forEach(s => store.setEntity(s.entity_id, s.state, s.attributes, s.last_changed, s.last_updated));
          this.config = await this.request({ type: 'get_config' }).catch(() => null);
          await this.request({ type: 'subscribe_events', event_type: 'state_changed' });
          this._startPing();
          this._setStatus('connected');
        } catch {
          try { this.ws.close(); } catch {}
        }
        break;
      }
      case 'result': {
        const p = this.pending.get(m.id);
        if (p) { this.pending.delete(m.id); m.success ? p.resolve(m.result) : p.reject(new Error(m.error?.message || 'service failed')); }
        break;
      }
      case 'event': {
        const ns = m.event?.data?.new_state;
        if (ns) store.setEntity(ns.entity_id, ns.state, ns.attributes, ns.last_changed, ns.last_updated);
        break;
      }
      case 'pong': break;
    }
  }

  request(obj) {
    return new Promise((resolve, reject) => {
      const id = this.msgId++;
      this.pending.set(id, { resolve, reject });
      this.ws.send(JSON.stringify({ id, ...obj }));
      setTimeout(() => { if (this.pending.has(id)) { this.pending.delete(id); reject(new Error('timeout')); } }, 10000);
    });
  }

  _startPing() {
    this._pingTimer = setInterval(() => {
      this.request({ type: 'ping' }).catch(() => { try { this.ws.close(); } catch {} });
    }, 30000);
  }
  _stopPing() { clearInterval(this._pingTimer); }

  disconnect() { this._closedByUser = true; try { this.ws?.close(); } catch {} }

  get connected() { return this.status === 'connected'; }

  callService(domain, service, data) {
    if (this.connected)
      return this.request({ type: 'call_service', domain, service, service_data: data });
    if (this.demo) return this._demoService(domain, service, data);
    return Promise.reject(new Error('not connected'));
  }

  async fetchHistory(entityIds, hours) {
    if (this.demo || !this.connected) return null;
    const url = TokenProvider.getUrl(), token = TokenProvider.getToken();
    const start = new Date(Date.now() - hours * 3600e3).toISOString();
    const r = await fetch(`${url}/api/history/period/${start}?filter_entity_id=${entityIds.join(',')}&minimal_response`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    return r.ok ? r.json() : null;
  }

  // ══════════ Demo Mode(展示用:所有資料皆為模擬,不連任何真實裝置) ══════════
  // 泛用服務模擬:依 domain/service 對本地 store 做合理的狀態變化,
  // 讓面板上幾乎每個互動(冷氣/風扇/除濕機/掃拖機/媒體/投影機…)在示範模式下都「看起來真的會動」。
  _demoService(domain, service, data) {
    return new Promise(res => setTimeout(() => {
      const id = data.entity_id;
      const cur = store.get(id);
      const a = { ...(cur?.attributes ?? {}) };
      let state = cur?.state;

      const set = (s, attrs) => store.setEntity(id, s ?? state, { ...a, ...(attrs ?? {}) });

      switch (domain) {
        case 'light':
        case 'switch': {
          if (service === 'toggle') set(cur?.state === 'on' ? 'off' : 'on');
          if (service === 'turn_on') set('on', data.brightness ? { brightness: data.brightness } : {});
          if (service === 'turn_off') set('off');
          break;
        }
        case 'climate': {
          if (service === 'turn_on') set(a.hvac_modes?.find(m => m !== 'off') ?? 'cool');
          if (service === 'turn_off') set('off');
          if (service === 'set_temperature' && typeof data.temperature === 'number') set(state, { temperature: data.temperature });
          if (service === 'set_hvac_mode') set(data.hvac_mode);
          if (service === 'set_fan_mode') set(state, { fan_mode: data.fan_mode });
          break;
        }
        case 'fan': {
          if (service === 'turn_on') set('on');
          if (service === 'turn_off') set('off');
          if (service === 'set_percentage') set('on', { percentage: data.percentage });
          if (service === 'set_preset_mode') set(state, { preset_mode: data.preset_mode });
          if (service === 'oscillate') set(state, { oscillating: data.oscillating });
          if (service === 'set_direction') set(state, { direction: data.direction });
          break;
        }
        case 'humidifier': {
          if (service === 'turn_on') set('on');
          if (service === 'turn_off') set('off');
          if (service === 'set_humidity') set(state, { humidity: data.humidity });
          if (service === 'set_mode') set(state, { mode: data.mode });
          break;
        }
        case 'media_player': {
          if (service === 'turn_on') set('on');
          if (service === 'turn_off') set('off');
          if (service === 'volume_set') set(state, { volume_level: data.volume_level });
          if (service === 'volume_up') set(state, { volume_level: Math.min(1, (a.volume_level ?? .3) + .05) });
          if (service === 'volume_down') set(state, { volume_level: Math.max(0, (a.volume_level ?? .3) - .05) });
          if (service === 'volume_mute') set(state, { is_volume_muted: data.is_volume_muted });
          if (service === 'media_play_pause') set(state === 'playing' ? 'paused' : 'playing');
          break;
        }
        case 'vacuum': {
          if (service === 'start') set('cleaning');
          if (service === 'pause') set('paused');
          if (service === 'return_to_base') {
            set('returning');
            setTimeout(() => store.setEntity(id, 'docked', a), 4000);   // 模擬回充完成
          }
          break;
        }
        case 'cover': {
          if (service === 'open_cover') set('open', { current_position: 100 });
          if (service === 'close_cover') set('closed', { current_position: 0 });
          if (service === 'stop_cover') set(state);
          if (service === 'set_cover_position') set(data.position >= 100 ? 'open' : data.position <= 0 ? 'closed' : 'open', { current_position: data.position });
          break;
        }
        case 'select': {
          if (service === 'select_option') set(data.option);
          break;
        }
        case 'number': {
          if (service === 'set_value') set(String(data.value));
          break;
        }
        case 'lock': {
          if (service === 'lock') set('locked');
          if (service === 'unlock') set('unlocked');
          break;
        }
        case 'scene':
          bus.emit('demoScene', data.entity_id);
          break;
        // button.press / remote.send_command / localtuya.set_dp / persistent_notification.create:
        // 沒有有意義的本地狀態可模擬,單純回報成功即可(呼叫端已自行處理提示文字)
        default: break;
      }
      res(true);
    }, 120));
  }

// ===== three/FloorplanScene.js =====
// ═══════════════ FloorplanScene ═══════════════
// 原始平面圖為 Base Layer(不重繪格局),其上疊:
// 擠出牆體 / 房間互動面 / 燈光 Glow / 感測特效 / CSS2D 標籤
import * as THREE from 'three';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const ACCENT = 0x6fb7ff, WARM = 0xffd9a0, PAPER = 0xf5f7fa;

class FloorplanScene {
  constructor(container, perf) {
    this.container = container;
    this.perf = perf;
    this.scene = new THREE.Scene();
    this.raycaster = new THREE.Raycaster();
    this.pointer = new THREE.Vector2(-9, -9);
    this.hoverRoom = null;
    this.roomMeshes = [];
    this.glows = new Map();     // roomId → glow mesh
    this.motionFx = [];
    this.camAnim = null;
    this.viewMode = 0;          // 0 iso / 1 top / 2 perspective
    this._clock = new THREE.Clock();
    this.layers = {};           // floorplan / wall / room / device / effect / particle
    ['floorplan','wall','furniture','room','device','effect','particle'].forEach(n => {
      this.layers[n] = new THREE.Group();
      this.layers[n].name = n;
      this.scene.add(this.layers[n]);
    });
    this.focused = null;
    this._fps = { frames: 0, t: 0, value: 60 };
    this.quality = 'high';
  }

  // ── 座標轉換:平面圖座標 → Three 世界座標 ──
  toWorld(x, y, z = 0) { return new THREE.Vector3(x, z, y); }

  async init() {
    // Renderer:WebGPU 優先、內建 WebGL fallback
    // Safari/iOS 的 WebGPU 會把貼圖渲染出彩虹雜訊 → Apple 裝置強制 WebGL(可用 ?renderer=webgpu/webgl 覆寫)
    const rq = new URLSearchParams(location.search).get('renderer');
    const isApple = /iPhone|iPad|iPod/.test(navigator.userAgent) || navigator.vendor === 'Apple Computer, Inc.';
    const forceWebGL = rq === 'webgl' || (rq !== 'webgpu' && isApple);
    this._isApple = isApple;
    this.renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true, forceWebGL });
    await this.renderer.init();
    // WebGL 預設開啟 dithering,iOS 上會把半透明漸層渲染成彩色雜點 → 關閉
    try {
      const gl = this.renderer.backend?.gl || this.renderer.getContext?.();
      if (gl && gl.DITHER) gl.disable(gl.DITHER);
    } catch {}
    // 註:WebGPU 後端與 shadowMap 在 three r170 相性不良(整體渲染失效),立體感改以亮暗面+邊線呈現
    this.renderer.setPixelRatio(this.perf.pixelRatio);
    this.renderer.setSize(innerWidth, innerHeight);
    this.container.appendChild(this.renderer.domElement);

    this.labelRenderer = new CSS2DRenderer();
    this.labelRenderer.setSize(innerWidth, innerHeight);
    Object.assign(this.labelRenderer.domElement.style, { position: 'absolute', top: '0', pointerEvents: 'none' });
    this.container.appendChild(this.labelRenderer.domElement);

    this._camera();
    this._lights();
    this._floorplanBase();
    this._walls();
    this._furniture();
    this._rooms();
    this._events();

    bus.on('entity', e => this._onEntity(e));
    this.renderer.setAnimationLoop(() => this._tick());
  }

  // 依螢幕比例自動放大取景:手機直向也能看到完整平面圖
  _frustumS() {
    const a = innerWidth / innerHeight;
    return Math.max(460, 720 / a);
  }

  _camera() {
    const aspect = innerWidth / innerHeight;
    const S = this._frustumS();
    this.camera = new THREE.OrthographicCamera(-S * aspect, S * aspect, S, -S, -2000, 4000);
    this.center = this.toWorld(PLAN.viewBox.x + PLAN.viewBox.w / 2 - 60, PLAN.viewBox.y + PLAN.viewBox.h / 2 + 40);
    let v = 1;                                            // 預設俯視 2D;記住使用者上次選的視角
    try { const s = localStorage.getItem('VIEW_MODE'); if (s !== null) v = Math.min(2, Math.max(0, parseInt(s) || 0)); } catch {}
    this._setView(v, true);
  }

  _setView(mode, instant = false) {
    this.viewMode = mode;
    try { localStorage.setItem('VIEW_MODE', mode); } catch {}
    if (this.layers.furniture) this.layers.furniture.visible = mode !== 1;   // 俯視 2D 保留純平面圖
    const c = this.center;
    const targets = [
      c.clone().add(new THREE.Vector3(-260, 620, 560)),   // slight isometric
      c.clone().add(new THREE.Vector3(0, 900, 0.01)),     // top 2D
      c.clone().add(new THREE.Vector3(-520, 430, 720)),   // perspective 感
    ];
    this._animateCamera(targets[mode], c, instant);
  }

  _animateCamera(pos, look, instant = false, zoom = 1) {
    if (instant) { this.camera.position.copy(pos); this.camera.lookAt(look); this._look = look.clone(); this.camera.zoom = zoom; this.camera.updateProjectionMatrix(); return; }
    // 視線目標(fromL→toL)與位置一起插值;相機偏移向量以觀察點為中心做球面插值(slerp):
    // 同方向轉場 = 純平移+縮放(零旋轉);需要轉角度時(如斜角↔俯視)角速度恆定、不會末端急轉
    const fromL = (this._look ?? look).clone();
    this.camAnim = {
      t: 0, fromZ: this.camera.zoom, toZ: zoom, fromL, toL: look.clone(),
      fromOff: this.camera.position.clone().sub(fromL), toOff: pos.clone().sub(look)
    };
  }

  focusRoom(room) {
    this.focused = room;
    ROOMS.forEach(r => r._labelEl?.classList.toggle('reveal', r === room));
    const rc = room.rects[0];
    const c = this.toWorld(rc[0] + rc[2] / 2, rc[1] + rc[3] / 2);
    const off = this.viewMode === 1 ? new THREE.Vector3(0, 900, .01) : new THREE.Vector3(-260, 620, 560);
    this._animateCamera(c.clone().add(off), c, false, 1.6);
    // 其他房間降透明(以深色遮罩實現)
    this._dimOthers(room);
  }
  resetFocus() { this.focused = null; this._dimOthers(null); this._setView(this.viewMode); this.camAnim.toZ = 1; }

  _dimOthers(room) {
    if (!this._dimGroup) { this._dimGroup = new THREE.Group(); this.layers.effect.add(this._dimGroup); }
    this._dimGroup.clear();
    if (!room) return;
    ROOMS.filter(r => r !== room).forEach(r => r.rects.forEach(rc => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(rc[2], rc[3]),
        new THREE.MeshBasicMaterial({ color: 0x0b0d0f, transparent: true, opacity: .42, depthWrite: false }));
      m.rotation.x = -Math.PI / 2;
      m.position.set(rc[0] + rc[2] / 2, 2, rc[1] + rc[3] / 2);
      this._dimGroup.add(m);
    }));
  }

  _lights() {
    this.ambient = new THREE.AmbientLight(0x9aa3ae, 1.2);
    this.sun = new THREE.DirectionalLight(0xbfd4ff, 1.0);
    this.sun.position.set(-300, 800, 400);
    this.scene.add(this.ambient, this.sun);
    this._applyTimeAmbient();
    setInterval(() => this._applyTimeAmbient(), 10 * 60 * 1000);
  }

  // 時間 → 環境色溫(非常 subtle)
  _applyTimeAmbient() {
    const h = new Date().getHours();
    const preset =
      h >= 6 && h < 10  ? { a: 0xcabfae, ai: 1.55, s: 0xffe8c8, si: 1.0 } :  // Morning warm soft
      h >= 10 && h < 17 ? { a: 0xcfc9bd, ai: 1.65, s: 0xfff1dc, si: 1.05 } : // Day warm white(牆呈暖白)
      h >= 17 && h < 22 ? { a: 0xbfae98, ai: 1.4,  s: 0xffd9a0, si: .9 } :   // Evening warm
                          { a: 0x8a8fa0, ai: 1.0,  s: 0xafc0d8, si: .6 };    // Night dim cool
    this.ambient.color.setHex(preset.a); this.ambient.intensity = preset.ai;
    this.sun.color.setHex(preset.s); this.sun.intensity = preset.si;
  }

  // ── Layer 0:原始平面圖(材質貼於地面,深色調處理)──
  _floorplanBase() {
    const vb = PLAN.viewBox;
    const geo = new THREE.PlaneGeometry(vb.w, vb.h);
    const tex = new THREE.TextureLoader().load(PLAN.image);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    if (this._isApple) {                      // iOS Safari:大貼圖 mipmap 會出現彩虹雜訊 → 停用 mipmap
      tex.generateMipmaps = false;
      tex.minFilter = THREE.LinearFilter;
      tex.anisotropy = 1;
    }
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: .97, color: 0xe9e5dc }); // 提亮:地板呈現真實材質感
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(vb.x + vb.w / 2, 0, vb.y + vb.h / 2);
    this.layers.floorplan.add(m);

    // 外框基座
    // 接觸陰影(建築模型感)
    const shTex = this._radialTexture();
    const sh = new THREE.Mesh(
      new THREE.PlaneGeometry(vb.w * 1.5, vb.h * 1.5),
      new THREE.MeshBasicMaterial({ map: shTex, color: 0x000000, transparent: true, opacity: .5, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2;
    sh.position.set(vb.x + vb.w / 2, -16, vb.y + vb.h / 2);
    this.layers.floorplan.add(sh);

    const baseGeo = new THREE.BoxGeometry(vb.w + 40, 14, vb.h + 40);
    const base = new THREE.Mesh(baseGeo, new THREE.MeshStandardMaterial({ color: 0x0e1114, roughness: .95, metalness: 0 }));
    base.position.set(vb.x + vb.w / 2, -8, vb.y + vb.h / 2);
    this.layers.floorplan.add(base);
  }

  // ── Layer 1:擠出牆體 + Edge Glow ──
  _walls() {
    const wallMat = new THREE.MeshStandardMaterial({
      color: 0xece8e0, roughness: .88, metalness: 0     // 暖白牆體(參考建築模型/實景渲染)
    });
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x6b7280, transparent: true, opacity: .16 });
    const g = new THREE.Group();
    const addBox = (x, y, w, d, h) => {
      const geo = new THREE.BoxGeometry(w, h, d);
      const m = new THREE.Mesh(geo, wallMat);
      m.position.set(x + w / 2, h / 2, y + d / 2);
      g.add(m);
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
      e.position.copy(m.position);
      g.add(e);
    };
    WALLS.forEach(w => addBox(w[0], w[1], w[2], w[3], PLAN.wallHeight));
    COLUMNS.forEach(c => addBox(c[0] - 16, c[1] - 16, 32, 32, PLAN.columnHeight));
    this.layers.wall.add(g);
  }

  // ── Layer 1.5:家具量體(組合量體 + 投影,大件才做)──
  _furniture() {
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x30353c, transparent: true, opacity: .16 });
    const box = (x, y, w, d, h, color, y0 = 0, edges = true) => {
      const geo = new THREE.BoxGeometry(w, h, d);
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: .9, metalness: 0 }));
      m.position.set(x + w / 2, y0 + h / 2 + .6, y + d / 2);
      this.layers.furniture.add(m);
      if (edges) {
        const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
        e.position.copy(m.position);
        this.layers.furniture.add(e);
      }
      return m;
    };
    FURNITURE.forEach(([x, y, w, d, h, color, kind]) => {
      if (kind === 'bed') {                                                    // 床架+床墊+枕頭×2+被毯
        box(x, y, w, d, 7, 0xC9A97C);
        box(x + 5, y + 5, w - 10, d - 10, 6, 0xF2EEE6, 7, false);
        const pw = (w - 36) / 2, pd = Math.min(30, d * .18);
        box(x + 12, y + d - pd - 9, pw, pd, 4, 0xFAF8F3, 13, false);
        box(x + w - pw - 12, y + d - pd - 9, pw, pd, 4, 0xFAF8F3, 13, false);
        box(x + 5, y + 5, w - 10, (d - 10) * .52, 3.5, 0xD8CDBB, 13, false);
      } else if (kind === 'sofa') {                                            // 座墊+背靠+扶手
        box(x, y, w, d, 9, color);
        box(x, y + d - 13, w, 13, 19, 0xDDD3C0);
        box(x, y, 11, d, 15, 0xDDD3C0);
        box(x + w - 11, y, 11, d, 15, 0xDDD3C0);
      } else if (kind === 'table') {                                           // 桌腳座+桌面
        box(x + w * .18, y + d * .18, w * .64, d * .64, 11, 0x9A7B52, 0, false);
        box(x, y, w, d, 4, color, 11);
      } else {
        box(x, y, w, d, h, color);
      }
    });
  }

  // ── Layer 2:房間互動面 + 燈光 Glow + 標籤 ──
  _rooms() {
    const glowTex = this._radialTexture();
    ROOMS.forEach(room => {
      room.rects.forEach(rc => {
        const geo = new THREE.PlaneGeometry(rc[2], rc[3]);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false }); // depthWrite:false — 否則透明排序在地板前繪製時會把平面圖像素深度剔除,整間變黑
        const m = new THREE.Mesh(geo, mat);
        m.rotation.x = -Math.PI / 2;
        m.position.set(rc[0] + rc[2] / 2, 1.5, rc[1] + rc[3] / 2);
        m.userData.room = room;
        this.layers.room.add(m);
        this.roomMeshes.push(m);
      });
      // Hover 邊界描線(空間被理解,而非 CSS hover)
      room._outlines = room.rects.map(rc => {
        const pts = [
          this.toWorld(rc[0], rc[1], 3), this.toWorld(rc[0] + rc[2], rc[1], 3),
          this.toWorld(rc[0] + rc[2], rc[1] + rc[3], 3), this.toWorld(rc[0], rc[1] + rc[3], 3)
        ];
        const line = new THREE.Line( // WebGPU 不支援 LineLoop:改 Line 並手動閉合
          new THREE.BufferGeometry().setFromPoints([...pts, pts[0].clone()]),
          new THREE.LineBasicMaterial({ color: PAPER, transparent: true, opacity: 0, depthWrite: false }));
        this.layers.room.add(line);
        return line;
      });
      // 燈光 Glow(sprite)
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex, color: WARM, transparent: true, opacity: 0,
        depthWrite: false, blending: THREE.NormalBlending
      }));
      const rc = room.rects[0];
      const rad = Math.min(Math.max(rc[2], rc[3]) * 1.35, 420);
      sp.scale.set(rad, rad, 1);
      sp.position.copy(this.toWorld(room.lamp[0], room.lamp[1], 8));
      this.layers.effect.add(sp);
      // 光池:覆蓋整間房的暖色染色層
      const pools = room.rects.map(rc => {
        const pool = new THREE.Mesh(
          new THREE.PlaneGeometry(rc[2], rc[3]),
          new THREE.MeshBasicMaterial({ color: WARM, transparent: true, opacity: 0, depthWrite: false }));
        pool.rotation.x = -Math.PI / 2;
        pool.position.set(rc[0] + rc[2] / 2, 2.2, rc[1] + rc[3] / 2);
        this.layers.effect.add(pool);
        return pool;
      });
      this.glows.set(room.id, { sprite: sp, pools, target: 0, value: 0 });

      // 設備節點(燈)
      const el = document.createElement('div');
      el.className = 'dev-label';
      el.innerHTML = `<i></i><b>${room.name}</b>`;
      el.setAttribute('aria-label', room.name);
      el.addEventListener('click', ev => { ev.stopPropagation(); bus.emit('openDevice', room); });
      const lab = new CSS2DObject(el);
      lab.position.copy(this.toWorld(room.lamp[0], room.lamp[1], PLAN.wallHeight + 22));
      this.layers.device.add(lab);
      room._labelEl = el;
    });

    // 子燈徽章(電視牆/展示櫃/鞋櫃):獨立迴路的燈,點徽章直接開關
    const EXTRA_LIGHTS = [
      { id: 'light.living_tv',      label: '電視牆', x: 270, y: 30 },
      { id: 'light.living_cabinet', label: '展示櫃', x: 392, y: 38 },
      { id: 'light.entry_cabinet',  label: '鞋櫃',   x: 36,  y: -96 },
    ];
    this._extraBadges = new Map();
    EXTRA_LIGHTS.forEach(cfg => {
      const el = document.createElement('div');
      el.className = 'dev-label dev-sub';
      el.innerHTML = `<i></i><b>${cfg.label}</b>`;
      el.setAttribute('aria-label', `${cfg.label}燈`);
      el.addEventListener('click', ev => { ev.stopPropagation(); bus.emit('toggleLight', cfg); });
      const lab = new CSS2DObject(el);
      lab.position.copy(this.toWorld(cfg.x, cfg.y, PLAN.wallHeight + 22));
      this.layers.device.add(lab);
      this._extraBadges.set(cfg.id, el);
    });

    // v71 寵物餵食器徽章(展示櫃旁實際擺放位置):點了直接開即時影像
    {
      const el = document.createElement('div');
      el.className = 'dev-label dev-sub';
      el.innerHTML = `<i></i><b>餵食器</b>`;
      el.setAttribute('aria-label', '寵物餵食器即時影像');
      el.addEventListener('click', ev => { ev.stopPropagation(); bus.emit('openPetCam'); });
      const lab = new CSS2DObject(el);
      lab.position.copy(this.toWorld(435, 82, PLAN.wallHeight + 22));
      this.layers.device.add(lab);
    }

    // Hover tooltip(單一浮動面板)
    this.tipEl = document.createElement('div');
    this.tipEl.className = 'room-tip';
    this.tip = new CSS2DObject(this.tipEl);
    this.tip.visible = false;              // 用 Object3D.visible 控制:CSS2DRenderer 每幀會覆寫 style.display,不能用它藏
    this.scene.add(this.tip);
  }

  _radialTexture() {
    const N = 512;                                   // 高解析漸層:避免大幅放大後 iOS 抖色出現彩虹雜點
    const c = document.createElement('canvas'); c.width = c.height = N;
    const ctx = c.getContext('2d');
    const gr = ctx.createRadialGradient(N / 2, N / 2, N / 32, N / 2, N / 2, N / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(.4, 'rgba(255,255,255,.35)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, N, N);
    return new THREE.CanvasTexture(c);
  }

  // ── Entity 狀態 → 視覺(僅更新必要物件)──
  _onEntity({ id, state, attributes }) {
    const m = id.match(/^light\.(\w+)$/);
    if (m) {
      const g = this.glows.get(m[1]);
      const room = ROOMS.find(r => r.id === m[1]);
      if (g) {
        const br = (attributes?.brightness ?? 255) / 255;         // Brightness → Glow 強度/尺寸
        g.target = state === 'on' ? .18 + br * .38 : 0;
        g.scaleT = state === 'on' ? .6 + br * .6 : .6;
      }
      if (room?._labelEl) room._labelEl.classList.toggle('on', state === 'on');
    }
    const ex = this._extraBadges?.get(id);
    if (ex) ex.classList.toggle('on', state === 'on');
    if (state === 'on' && MOTION_INFO[id]) this._motionPulse(MOTION_INFO[id].room);   // 真實人體感應器 → 對應房間雷達脈衝
    if (attributes?.device_class === 'door' && state === 'on') {
      const roomId = DOOR_INFO[id]?.room;          // 從門名單查所屬房間;查不到就不閃(不再一律閃陽台)
      if (roomId) this._doorPulse(roomId);
    }
  }

  _doorPulse(roomId) {
    const room = ROOMS.find(r => r.id === roomId); if (!room) return;
    const rc = room.rects[0];
    const geo = new THREE.PlaneGeometry(rc[2], rc[3]);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffb300, transparent: true, opacity: .32, side: THREE.DoubleSide, depthWrite: false });
    const p = new THREE.Mesh(geo, mat);
    p.rotation.x = -Math.PI / 2;
    p.position.set(rc[0] + rc[2] / 2, 2.5, rc[1] + rc[3] / 2);
    this.layers.effect.add(p);
    this.motionFx.push({ mesh: p, t: 0, kind: 'door' });
  }

  _motionPulse(roomId) {
    const room = ROOMS.find(r => r.id === roomId); if (!room) return;
    const geo = new THREE.RingGeometry(4, 6, 48);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00e676, transparent: true, opacity: .9, side: THREE.DoubleSide, depthWrite: false });
    const ring = new THREE.Mesh(geo, mat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.copy(this.toWorld(room.lamp[0], room.lamp[1], 3));
    this.layers.effect.add(ring);
    this.motionFx.push({ mesh: ring, t: 0 });
  }

  _events() {
    addEventListener('resize', () => {
      const aspect = innerWidth / innerHeight, S = this._frustumS();
      Object.assign(this.camera, { left: -S * aspect, right: S * aspect, top: S, bottom: -S });
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(innerWidth, innerHeight);
      this.labelRenderer.setSize(innerWidth, innerHeight);
    });
    this.container.addEventListener('pointermove', e => {
      this.pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      this._ptrType = e.pointerType;
    });

    // ── 手勢:單指(按住)拖移平移、雙指縮放、滾輪縮放、雙擊/雙點回全景 ──
    const T = this._touch = { pts: new Map(), start0: 0, zoom0: 1, moved: 0, lastTap: 0 };
    const clampZoom = z => Math.min(3, Math.max(.45, z));
    this.container.addEventListener('pointerdown', e => {
      // 觸控點按不會先觸發 pointermove:按下當下就更新射線座標,房間區域才點得到
      this.pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      this._ptrType = e.pointerType;
      T.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      T.moved = 0;
      if (T.pts.size === 2) {
        const [a, b] = [...T.pts.values()];
        T.start0 = Math.hypot(a.x - b.x, a.y - b.y);
        T.zoom0 = this.camera.zoom;
      }
      if (T.pts.size === 1) {
        const now = performance.now();
        if (now - T.lastTap < 320) { this._setView(this.viewMode); T.lastTap = 0; T.moved = 999; }
        else T.lastTap = now;
      }
    });
    const panBy = (dx, dy) => {                        // 螢幕像素 → 世界平移(相機與視線同步移動,不旋轉)
      const wpp = (2 * this._frustumS()) / innerHeight / this.camera.zoom;
      const m = this.camera.matrix.elements;
      const right = new THREE.Vector3(m[0], m[1], m[2]).multiplyScalar(-dx * wpp);
      const up = new THREE.Vector3(m[4], m[5], m[6]).multiplyScalar(dy * wpp);
      const delta = right.add(up);
      this.camera.position.add(delta);
      this._look?.add(delta);
    };
    this.container.addEventListener('pointermove', e => {
      const p = T.pts.get(e.pointerId);
      if (!p) return;
      if (T.pts.size === 2) {                          // 雙指:同時平移(中心點位移)+ 縮放(指距比例)
        const a0 = [...T.pts.values()];
        const c0 = { x: (a0[0].x + a0[1].x) / 2, y: (a0[0].y + a0[1].y) / 2 };
        T.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const a1 = [...T.pts.values()];
        const c1 = { x: (a1[0].x + a1[1].x) / 2, y: (a1[0].y + a1[1].y) / 2 };
        T.moved += Math.abs(c1.x - c0.x) + Math.abs(c1.y - c0.y) + 1;
        if (!this.camAnim) {
          panBy(c1.x - c0.x, c1.y - c0.y);
          const d = Math.hypot(a1[0].x - a1[1].x, a1[0].y - a1[1].y);
          if (T.start0 > 0) {
            this.camera.zoom = clampZoom(T.zoom0 * d / T.start0);
            this.camera.updateProjectionMatrix();
          }
        }
      } else if (e.pointerType === 'mouse' && e.buttons) {   // 滑鼠:按住拖移平移
        const dx = e.clientX - p.x, dy = e.clientY - p.y;
        T.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        T.moved += Math.abs(dx) + Math.abs(dy);
        if (T.moved > 6 && !this.camAnim) panBy(dx, dy);
      } else {                                          // 單指:只負責點房間(累計位移防誤觸)
        T.moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y);
        T.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      }
    });
    const endPt = e => { T.pts.delete(e.pointerId); if (T.pts.size < 2) T.start0 = 0; };
    this.container.addEventListener('pointerup', endPt);
    this.container.addEventListener('pointercancel', endPt);
    this.container.addEventListener('wheel', e => {
      e.preventDefault();
      this.camera.zoom = clampZoom(this.camera.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
      this.camera.updateProjectionMatrix();
    }, { passive: false });

    this.container.addEventListener('click', () => {
      if (T.moved > 10) return;                       // 拖移結束的 click 不當作點房間
      if (this.hoverRoom) bus.emit('roomClick', this.hoverRoom);
    });
  }

  cycleView() { this._setView((this.viewMode + 1) % 3); }
  setLayerVisible(name, v) { if (this.layers[name]) this.layers[name].visible = v; }
  get backend() { return this.renderer?.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL'; }

  // ── Render Loop ──
  _tick() {
    const dt = this._clock.getDelta();

    // 展示廳呼吸(Ambient 模式、且非 reduced-motion)
    if (document.body.classList.contains('ambient') && !this.camAnim &&
        !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const t = performance.now() / 1000;
      this.camera.position.x += Math.sin(t * .08) * .06;
      this.camera.position.z += Math.cos(t * .06) * .05;   // 純平移漂移,不 lookAt 重新定向(避免持續轉向)
    }

    // Camera 平滑插值
    if (this.camAnim) {
      const a = this.camAnim;
      a.t = Math.min(1, a.t + dt / 1.1);
      const k = a.t < .5 ? 4 * a.t ** 3 : 1 - Math.pow(-2 * a.t + 2, 3) / 2;   // easeInOut(移除 settle 彈跳)

      this._look = new THREE.Vector3().lerpVectors(a.fromL, a.toL, k);
      const vF = a.fromOff.clone().normalize(), vT = a.toOff.clone().normalize();
      const q = new THREE.Quaternion().slerp(new THREE.Quaternion().setFromUnitVectors(vF, vT), k);
      const rad = lerp(a.fromOff.length(), a.toOff.length(), k);
      this.camera.position.copy(this._look).addScaledVector(vF.applyQuaternion(q), rad);
      this.camera.zoom = lerp(a.fromZ, a.toZ, k);
      this.camera.updateProjectionMatrix();
      this.camera.lookAt(this._look);
      if (a.t >= 1) { this._look = a.toL.clone(); this.camAnim = null; }
    }

    // Hover 偵測(轉場中暫停,避免 tooltip/標籤開關造成 DOM 抖動)
    if (!this.camAnim) {
    this.raycaster.setFromCamera(this.pointer, this.camera);
    const hits = this.raycaster.intersectObjects(this.roomMeshes);
    const room = hits[0]?.object.userData.room || null;
    if (room !== this.hoverRoom) {
      this.roomMeshes.forEach(m => m.material.opacity = 0);
      this.hoverRoom = room;
      ROOMS.forEach(r => r._labelEl?.classList.toggle('reveal', r === room || r === this.focused));
      this.container.style.cursor = room ? 'pointer' : 'default';
      if (room) this._showTip(room); else this.tip.visible = false;
    }
    ROOMS.forEach(r => {
      const target = r === this.hoverRoom || r === this.focused ? .45 : 0;
      r._outlines?.forEach(l => l.material.opacity = lerp(l.material.opacity, target, dt * 8));
    });
    if (this.hoverRoom) {
      this.roomMeshes.filter(m => m.userData.room === this.hoverRoom)
        .forEach(m => m.material.opacity = .045);
      this._updateTipValues(this.hoverRoom);
    }
    }

    // 光暈趨近動畫(強度+尺寸)
    this.glows.forEach(g => {
      g.value = lerp(g.value, g.target, dt * 5);
      g.sprite.material.opacity = g.value;
      g.pools?.forEach(p => p.material.opacity = g.value * .22);   // 光溢散至房間
      if (g.scaleT != null) {
        g.scaleV = lerp(g.scaleV ?? g.scaleT, g.scaleT, dt * 4);
        const base = g.baseScale ?? (g.baseScale = g.sprite.scale.x);
        g.sprite.scale.set(base * g.scaleV, base * g.scaleV, 1);
      }
    });

    // Adaptive Rendering:FPS 監測
    this._fps.frames++; this._fps.t += dt;
    if (this._fps.t >= 2) {
      this._fps.value = Math.round(this._fps.frames / this._fps.t);
      this._fps.frames = 0; this._fps.t = 0;
      const q = this._fps.value > 50 ? 'high' : this._fps.value > 28 ? 'medium' : 'low';
      this._qStreak = q === this._qLast ? (this._qStreak ?? 0) + 1 : 1;   // 連續兩個視窗才切換
      this._qLast = q;
      if (q !== this.quality && this._qStreak >= 2 && !this.camAnim) {    // 轉場中不切品質(setPixelRatio 會重建畫布造成頓挫)
        this.quality = q;
        this.layers.particle.visible = q === 'high';
        this.renderer.setPixelRatio(q === 'low' ? 1 : this.perf.pixelRatio);
      }
    }

    // Motion 雷達擴散
    this.motionFx = this.motionFx.filter(fx => {
      fx.t += dt;
      if (fx.kind === 'door') {                 // 門警示:原地淡出,不放大(放大 26 倍會整片蓋滿螢幕)
        fx.mesh.material.opacity = Math.max(0, .34 - fx.t * .26);
      } else {
        const s = 1 + fx.t * 26;
        fx.mesh.scale.set(s, s, s);
        fx.mesh.material.opacity = Math.max(0, .9 - fx.t * .7);
      }
      if (fx.t > 1.4) { this.layers.effect.remove(fx.mesh); fx.mesh.geometry.dispose(); fx.mesh.material.dispose(); return false; }
      return true;
    });

    this.renderer.render(this.scene, this.camera);
    this.labelRenderer.render(this.scene, this.camera);
  }

  _showTip(room) {
    // 觸控裝置沒有 hover 概念:點擊後射線會停在房間上,提示框會永遠卡在畫面 → 觸控一律不顯示
    if (this._ptrType !== 'mouse') { this.tip.visible = false; return; }
    this.tip.visible = true;
    clearTimeout(this._tipHide);                       // 保險絲:任何情況下提示框最多停留 5 秒,不會永久遮擋
    this._tipHide = setTimeout(() => this.tip.visible = false, 5000);
    const rc = room.rects[0];
    this.tip.position.copy(this.toWorld(rc[0] + rc[2] / 2, rc[1], PLAN.wallHeight + 46));
    this._updateTipValues(room, true);
  }
  _updateTipValues(room, force = false) {
    if (!force && performance.now() - (this._tipT || 0) < 500) return;
    this._tipT = performance.now();
    const t = store.get(`sensor.${room.id}_temperature`)?.state ?? '--';
    const h = store.get(`sensor.${room.id}_humidity`)?.state ?? '--';
    const on = store.isOn(`light.${room.id}`);
    this.tipEl.innerHTML = `
      <h4>${room.name}</h4>
      <div class="big">${t}°</div>
      <div class="row"><span>濕度</span><b>${h}%</b></div>
      <div class="row"><span>照明</span><b class="${on ? 'on' : ''}">${on ? '● 開' : '○ 關'}</b></div>`;
  }
}

  if (!e || e.state === 'unavailable') {
    body.innerHTML = `<div class="quiet-row" style="margin-top:14px"><span>${ac.name}冷氣目前離線</span></div>`;
    return;
  }
  const on = e.state !== 'off';
  const a = e.attributes ?? {};
  const target = a.temperature ?? '--';
  const cur = a.current_temperature ?? '--';
  const modes = (a.hvac_modes ?? []).filter(m => m !== 'off');
  const fans = a.fan_modes ?? [];

  body.innerHTML = `
    <div class="ac-top">
      <div>
        <div class="ac-cur">室溫 ${cur}°</div>
        <div class="big-number"><span id="acTempNum">${on ? target : '--'}</span><small> °C</small></div>
        <div class="ac-mode-now">${on ? zh(MODE_TXT, e.state) + ' · ' + zh(FAN_TXT, a.fan_mode) : '已關閉'}</div>
      </div>
      <button class="ac-power ${on ? 'on' : ''}" id="acPower" aria-label="電源">⏻</button>
    </div>
    ${on && typeof a.temperature === 'number' ? `
    <input type="range" class="ac-slider" id="acTempSlider" aria-label="溫度拖拉"
      min="${a.min_temp ?? 16}" max="${a.max_temp ?? 30}" step="${a.target_temp_step ?? 1}" value="${a.temperature}">` : ''}
    <div class="ac-steps ${on ? '' : 'ac-dim'}">
      <button class="ac-step" id="acMinus" aria-label="降低溫度">−</button>
      <button class="ac-step" id="acPlus" aria-label="升高溫度">+</button>
    </div>
    <div class="ac-sec">模式</div>
    <div class="ac-chips ${on ? '' : 'ac-dim'}">
      ${modes.map(m => `<button class="ac-chip ${e.state === m ? 'active' : ''}" data-m="${esc(m)}">${zh(MODE_TXT, m)}</button>`).join('')}
    </div>
    <div class="ac-sec">風速</div>
    <div class="ac-chips ${on ? '' : 'ac-dim'}">
      ${fans.map(f => `<button class="ac-chip ${a.fan_mode === f ? 'active' : ''}" data-f="${esc(f)}">${zh(FAN_TXT, f)}</button>`).join('')}
    </div>`;

  $('#acPower').onclick = () =>
    call('climate', on ? 'turn_off' : 'turn_on', { entity_id: ac.id }, `${ac.name}冷氣${on ? '已關' : '已開'}`);
  const step = d => {
    const t = a.temperature;
    if (typeof t !== 'number') return;
    const next = Math.min(a.max_temp ?? 30, Math.max(a.min_temp ?? 16, t + d));
    call('climate', 'set_temperature', { entity_id: ac.id, temperature: next });
  };
  $('#acMinus').onclick = () => step(-1);
  $('#acPlus').onclick = () => step(1);
  const acSl = $('#acTempSlider');
  if (acSl) {
    acSl.oninput = () => { const n = $('#acTempNum'); if (n) n.textContent = acSl.value; };
    acSl.onchange = () => call('climate', 'set_temperature', { entity_id: ac.id, temperature: +acSl.value }, `${ac.name}冷氣 ${acSl.value}°C`);
  }
  body.querySelectorAll('[data-m]').forEach(b =>
    b.onclick = () => call('climate', 'set_hvac_mode', { entity_id: ac.id, hvac_mode: b.dataset.m }));
  body.querySelectorAll('[data-f]').forEach(b =>
    b.onclick = () => call('climate', 'set_fan_mode', { entity_id: ac.id, fan_mode: b.dataset.f }));
}

// ── v71 寵物餵食器(Tuya):快照 + HLS 即時影像 + 攝影機設定 ──
const PETCAM = 'camera.petfeeder';
const PET_NV = 'select.petfeeder_night_vision';
const PET_SW = [
  ['light.petfeeder_indicator_light', '指示燈'],
  ['switch.petfeeder_motion_alarm', '動態警報'],
  ['switch.petfeeder_motion_recording', '動態錄影'],
];
const PETFEED_DEV = 'ebb03a42a51abf335d7lfi';   // LocalTuya 裝置 ID;投餵 = DP 201(1~20 份)
// v73 投餵(雙按確認防誤觸):第一次點武裝 3 秒,再點一次才真的出糧
let _feedArm = 0;
function feedRowHTML() {
  return `<div class="ac-sec">投餵</div>
    <div class="ac-chips">${[1, 2, 3].map(n => `<button class="ac-chip pet-feed" data-feed="${n}">${n} 份</button>`).join('')}</div>
    <div class="conn-hint">點份數後 3 秒內再按同一顆確認才會出糧;失敗多半是本地連線斷了,拔電重插餵食器即可恢復。</div>`;
}
function bindFeed(root) {
  root.querySelectorAll('[data-feed]').forEach(b => b.onclick = () => {
    const n = +b.dataset.feed;
    if (_feedArm === n) {
      _feedArm = 0; b.classList.remove('arm'); b.textContent = `${n} 份`;
      _ha.callService('localtuya', 'set_dp', { device_id: PETFEED_DEV, dp: 201, value: n })
        .then(() => bus.emit('toast', { msg: `已投餵 ${n} 份`, ok: true }))
        .catch(() => bus.emit('toast', { msg: '投餵失敗:本地連線中斷,拔電重插餵食器可恢復', ok: false }));
    } else {
      _feedArm = n;
      root.querySelectorAll('[data-feed]').forEach(x => { x.classList.remove('arm'); x.textContent = `${x.dataset.feed} 份`; });
      b.classList.add('arm'); b.textContent = '再按確認';
      setTimeout(() => { if (_feedArm === n) { _feedArm = 0; b.classList.remove('arm'); b.textContent = `${n} 份`; } }, 3000);
    }
  });
}
function petcamCard() {

// v72 改走 MJPEG(camera_proxy_stream + 簽名路徑):這台 Tuya 的 HLS 串流工人不出片
// (播放清單永遠 pending,是 Tuya 雲攝影機在 HA 的已知毛病),但快照通道正常,
// MJPEG 就是伺服器端連續快照組成的動態影像,<img> 原生支援、零相依。
async function openPetCam() {
  let sh = document.getElementById('petcam');
  if (!sh) {
    sh = document.createElement('div');
    sh.id = 'petcam'; sh.className = 'petcam-sheet';
    sh.innerHTML = `<div class="petcam-top"><b>寵物餵食器 · 即時影像</b><button id="petcamX" aria-label="關閉">×</button></div>
      <img id="petcamV" alt="寵物餵食器即時影像"><div class="conn-hint" id="petcamMsg">連線中…</div>${feedRowHTML()}`;
    document.body.appendChild(sh);
    sh.querySelector('#petcamX').onclick = closePetCam;
    bindFeed(sh);                                   // 看著畫面直接投餵,親眼確認毛小孩來吃
  }
  sh.classList.add('open');
  const v = sh.querySelector('#petcamV'), msg = sh.querySelector('#petcamMsg');
  msg.textContent = '連線中…';
  if (_ha.demo) {                                // 示範模式:不接真實影像串流,顯示說明文字即可
    v.src = PET_PLACEHOLDER;
    msg.textContent = '示範模式:此處為模擬畫面,非即時影像';
    return;
  }
  try {
    const sign = await _ha.request({ type: 'auth/sign_path', path: `/api/camera_proxy_stream/${PETCAM}`, expires: 1800 });
    v.onload = () => { msg.textContent = ''; };
    v.onerror = () => { msg.textContent = '影像連線失敗,關掉重開一次試試'; };
    v.src = sign.path;                          // 同源相對路徑,簽名有效 30 分鐘
  } catch { msg.textContent = '影像連線失敗,稍後再試'; }
}
function closePetCam() {
  const sh = document.getElementById('petcam'); if (sh) sh.classList.remove('open');
  const v = document.getElementById('petcamV');
  if (v) { v.removeAttribute('src'); }          // 中斷 MJPEG 連線,不留背景流量
}

// ── 媒體裝置卡(電視/音響/Chromecast 共用)──
function mediaCard(key, id, name, loc) {
  const e = store.get(id);
  if (!e || e.state === 'unavailable') return `<div class="cl-name">${name}${loc ? ` <span class="appl-loc">${loc}</span>` : ''}</div><div class="quiet-row"><span>目前離線</span></div>`;
  const isOn = !['off', 'unknown'].includes(e.state);
  const stTxt = isOn ? (e.state === 'playing' ? '播放中' : e.state === 'paused' ? '已暫停' : '開機中') + (e.attributes.app_name ? ' · ' + esc(e.attributes.app_name) : '') : '已關閉';
  // 依裝置能力位元決定顯示哪些控制(部分 Cast 裝置不開放音量,畫了也沒作用)
  const feat = e.attributes.supported_features ?? 0;
  const hasVol = !!(feat & 4) || !!(feat & 1024);   // VOLUME_SET / VOLUME_STEP
  const hasMute = !!(feat & 8);                      // VOLUME_MUTE
  return `
    <div class="cl-name">${name}${loc ? ` <span class="appl-loc">${loc}</span>` : ''}</div>
    <div class="appl-row">
      <span class="appl-state">${stTxt}</span>
      <button class="ac-power ${isOn ? 'on' : ''}" id="${key}Power" aria-label="${name}電源">⏻</button>
    </div>
    ${!!(feat & 4) && isOn && typeof e.attributes.volume_level === 'number' ?
      sliderHTML(`${key}VolSlider`, { min: 0, max: 100, step: 1, value: Math.round(e.attributes.volume_level * 100), label: `${name}音量拖拉` }) : ''}
    ${key === 'tv' && isOn ? tvSbVolBlock() : ''}
    ${key === 'tv' ? `<button class="insp-btn rc-open" data-rc="tv">🕹 開啟遙控器</button>` : ''}
    ${hasVol ? `
    <div class="ac-steps ${isOn ? '' : 'ac-dim'}">
      <button class="ac-step" id="${key}VolDn" aria-label="音量減">🔉 −</button>
      <button class="ac-step" id="${key}VolUp" aria-label="音量加">🔊 +</button>
    </div>` : ''}
    <div class="ac-chips ${isOn ? '' : 'ac-dim'}" style="margin-top:10px">
      ${hasMute ? `<button class="ac-chip" id="${key}Mute">靜音</button>` : ''}
      ${(feat & 1) || (feat & 16384) ? `<button class="ac-chip" id="${key}Play">播放 / 暫停</button>` : ''}
    </div>`;
}
// 電視卡的音量拉軸:電視走 Android TV Remote,只支援加/減鍵、不回報目前音量(無法做絕對定位拉軸);
// 但客廳聲音實際由 HT-A5000 音響(eARC)輸出,音響支援絕對音量 → 電視卡直接放音響的拉軸
// ── 觸控板(v62,v63 通用化):仿 Google Home 遙控——滑動換方向、點一下確認,走 Android TV Remote 指令 ──
const TV_REMOTE = 'remote.dian_shi';                 // Sony 電視
const CC_REMOTE = 'remote.jia_ting_yu_le_shi';       // 家庭娛樂室 Chromecast(投影機 HDMI;2026-08-30 配對)
function padHTML(remoteId, label) {
  const e = store.get(remoteId);
  if (!e || e.state === 'unavailable') return '';
  return `
    <div class="ac-sec">${label}</div>
    <div class="tv-pad" data-padremote="${remoteId}">滑動瀏覽 · 輕觸選取</div>
    <div class="ac-chips" style="margin-top:8px">
      <button class="ac-chip" data-rk="${remoteId}|BACK">← 返回</button>
      <button class="ac-chip" data-rk="${remoteId}|HOME">⌂ 主頁</button>
      <button class="ac-chip" data-rk="${remoteId}|MEDIA_PLAY_PAUSE">⏯</button>
    </div>`;
}
function bindPads(root = $('#applBody')) {
  if (!root) return;
  const send = (remote, command, n = 1) => call('remote', 'send_command', { entity_id: remote, command, num_repeats: n });
  root.querySelectorAll('.tv-pad').forEach(pad => {
    const remote = pad.dataset.padremote;
    let sx = 0, sy = 0, t0 = 0;
    pad.onpointerdown = e => { sx = e.clientX; sy = e.clientY; t0 = Date.now(); pad.setPointerCapture(e.pointerId); };
    pad.onpointerup = e => {
      const dx = e.clientX - sx, dy = e.clientY - sy;
      const dist = Math.hypot(dx, dy);
      if (dist < 18 && Date.now() - t0 < 500) return send(remote, 'DPAD_CENTER');   // 輕觸=確認
      if (dist < 18) return;
      const steps = Math.max(1, Math.min(4, Math.round(dist / 70)));                 // 滑越長走越多格(1–4)
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'DPAD_RIGHT' : 'DPAD_LEFT') : (dy > 0 ? 'DPAD_DOWN' : 'DPAD_UP');
      send(remote, dir, steps);
    };
  });
  root.querySelectorAll('[data-rk]').forEach(b =>
    b.onclick = () => { const [r, c] = b.dataset.rk.split('|'); send(r, c); });
}
